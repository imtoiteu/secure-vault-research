<text x="260" y="640" text-anchor="start" font-size="11" font-weight="400" fill="#3a4a5a">Lưu ý phương pháp: chỉ cột 1024 MiB là số đo. Bốn cột còn lại là ngoại suy tuyến tính từ hệ số đã đo và được ghi nhãn rõ ràng; chúng KHÔNG được coi là kết</text>
<text x="260" y="654" text-anchor="start" font-size="11" font-weight="400" fill="#3a4a5a">quả thực nghiệm.</text>
