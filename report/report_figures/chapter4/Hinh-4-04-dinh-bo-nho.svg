<text x="500.0" y="536.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4A4210">Vì sao hệ số xấp xỉ 2,7 lần</text>
<text x="500.0" y="550.5" text-anchor="middle" font-size="10" fill="#4A4210bb">Bốn bản sao cùng tồn tại trong bộ nhớ tại thời điểm cao nhất: bản đọc tệp nguồn, bản</text>
<text x="500.0" y="563.0" text-anchor="middle" font-size="10" fill="#4A4210bb">sao trong kho lưu trữ đã đóng gói, vùng đệm stdin đưa vào age và vùng đệm stdout nhận</text>
<text x="500.0" y="575.5" text-anchor="middle" font-size="10" fill="#4A4210bb">từ age. Toàn bộ đều là Vec&lt;u8&gt; nằm trong RAM.</text>
<rect x="770" y="500" width="350" height="100" rx="7" fill="#FCE4E4" stroke="#B3261E" stroke-width="1.6"/>
<text x="945.0" y="529.75" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5E1611">Biện pháp hiện tại là RÀO, không phải sửa gốc</text>
<text x="945.0" y="544.25" text-anchor="middle" font-size="10" fill="#5E1611bb">Trần 2 GiB cho một mục được kiểm bằng metadata TRƯỚC khi đọc,</text>
<text x="945.0" y="556.75" text-anchor="middle" font-size="10" fill="#5E1611bb">nên tệp quá lớn bị từ chối bằng SV-TOO-LARGE thay vì làm cạn</text>
<text x="945.0" y="569.25" text-anchor="middle" font-size="10" fill="#5E1611bb">bộ nhớ. Cách sửa triệt để là truyền dòng, hiện chưa được thực</text>
<text x="945.0" y="581.75" text-anchor="middle" font-size="10" fill="#5E1611bb">hiện (H1).</text>
