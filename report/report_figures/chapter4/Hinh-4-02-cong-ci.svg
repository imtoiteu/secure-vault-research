<text x="590.0" y="501.75" text-anchor="middle" font-size="10" fill="#0E3A19bb">Kiểm thử đầu-cuối age_backed_lifecycle_roundtrips chạy XANH trên máy windows-latest — đây là bằng chứng thực nghiệm đóng lại giả thuyết rủi ro H4 (lo ngại rằng env_clear() sẽ làm hỏng bộ sinh</text>
<text x="590.0" y="514.25" text-anchor="middle" font-size="10" fill="#0E3A19bb">số ngẫu nhiên / trình nạp DLL của age trên Windows). Chênh lệch 127 so với 126 kiểm thử giữa Linux và Windows là do một hàm chỉ biên dịch trên Unix, không phải lỗi.</text>
