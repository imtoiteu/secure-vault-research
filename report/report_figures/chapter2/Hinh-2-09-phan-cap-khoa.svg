<text x="470" y="137.0" text-anchor="middle" font-size="10.5" fill="#3a5060">Shamir k trong n</text>
<rect x="60" y="110" width="240" height="64" rx="7" fill="#FFF0F6" stroke="#B5197F" stroke-width="1.6"/>
<text x="180.0" y="140.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5A0C3E">Mật khẩu người dùng</text>
<text x="180.0" y="155.0" text-anchor="middle" font-size="10" fill="#5A0C3Ebb">IpcPassphrase → SecretBytes</text>
<rect x="60" y="200" width="240" height="56" rx="7" fill="#FFFFFF" stroke="#5B6675" stroke-width="1.6"/>
<text x="180.0" y="226.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1C2330">Muối 16 byte ngẫu nhiên</text>
<text x="180.0" y="241.0" text-anchor="middle" font-size="10" fill="#1C2330bb">lưu công khai trong header</text>
<rect x="60" y="282" width="240" height="56" rx="7" fill="#FFFFFF" stroke="#5B6675" stroke-width="1.6"/>
<text x="180.0" y="308.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1C2330">Tham số Argon2id</text>
<text x="180.0" y="323.0" text-anchor="middle" font-size="10" fill="#1C2330bb">mem_kib · time_cost · parallelism</text>
<rect x="360" y="176" width="220" height="84" rx="7" fill="#F3E8FD" stroke="#7A3FBF" stroke-width="1.6"/>
<text x="470.0" y="216.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3A1560">Argon2id</text>
<text x="470.0" y="231.0" text-anchor="middle" font-size="10" fill="#3A1560bb">hàm dẫn xuất khóa từ mật khẩu</text>
<rect x="650" y="176" width="260" height="84" rx="7" fill="#FFF0F6" stroke="#B5197F" stroke-width="1.6"/>
<text x="780.0" y="210.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5A0C3E">Khóa chủ MK (32 byte)</text>
<text x="780.0" y="224.75" text-anchor="middle" font-size="10" fill="#5A0C3Ebb">Key32, chỉ nằm trong RAM, tự xóa khi hủy —</text>
<text x="780.0" y="237.25" text-anchor="middle" font-size="10" fill="#5A0C3Ebb">KHÔNG BAO GIỜ ghi ra đĩa</text>
<rect x="380" y="330" width="470" height="60" rx="7" fill="#F3E8FD" stroke="#7A3FBF" stroke-width="1.6"/>
<text x="615.0" y="357.75" text-anchor="middle" font-size="11" font-weight="700" fill="#3A1560">BLAKE3::derive_key(&quot;secure-vault/v1/wrap/age-identity:&lt;uuid_hex&gt;&quot;, MK)</text>
<text x="615.0" y="370.75" text-anchor="middle" font-size="10" fill="#3A1560bb">ngữ cảnh đã đóng băng theo byte</text>
<rect x="380" y="404" width="470" height="60" rx="7" fill="#F3E8FD" stroke="#7A3FBF" stroke-width="1.6"/>
<text x="615.0" y="431.75" text-anchor="middle" font-size="11" font-weight="700" fill="#3A1560">BLAKE3::derive_key(&quot;secure-vault/v1/wrap/signing-key:&lt;uuid_hex&gt;&quot;, MK)</text>
<text x="615.0" y="444.75" text-anchor="middle" font-size="10" fill="#3A1560bb">đổi ngữ cảnh ⇒ đổi khóa ⇒ MAC hỏng</text>
<rect x="900" y="330" width="240" height="60" rx="7" fill="#FFF0F6" stroke="#B5197F" stroke-width="1.6"/>
<text x="1020.0" y="358.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5A0C3E">Khóa bọc A</text>
<text x="1020.0" y="373.0" text-anchor="middle" font-size="10" fill="#5A0C3Ebb">cho danh tính age</text>
<rect x="900" y="404" width="240" height="60" rx="7" fill="#FFF0F6" stroke="#B5197F" stroke-width="1.6"/>
<text x="1020.0" y="432.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5A0C3E">Khóa bọc S</text>
<text x="1020.0" y="447.0" text-anchor="middle" font-size="10" fill="#5A0C3Ebb">cho khóa ký Ed25519</text>
<rect x="380" y="506" width="320" height="74" rx="7" fill="#EAF6F6" stroke="#0F7B7B" stroke-width="1.6"/>
<text x="540.0" y="535.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0A3D3D">wrapped_age_identity</text>
<text x="540.0" y="549.75" text-anchor="middle" font-size="10" fill="#0A3D3Dbb">secretbox(nonce 24 B ‖ ciphertext + thẻ 16 B) — nằm</text>
<text x="540.0" y="562.25" text-anchor="middle" font-size="10" fill="#0A3D3Dbb">trong header CBOR</text>
<rect x="730" y="506" width="320" height="74" rx="7" fill="#EAF6F6" stroke="#0F7B7B" stroke-width="1.6"/>
<text x="890.0" y="535.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0A3D3D">wrapped_signing_key</text>
<text x="890.0" y="549.75" text-anchor="middle" font-size="10" fill="#0A3D3Dbb">secretbox(nonce ‖ ciphertext + thẻ) — nằm trong header</text>
<text x="890.0" y="562.25" text-anchor="middle" font-size="10" fill="#0A3D3Dbb">CBOR</text>
<rect x="380" y="616" width="320" height="62" rx="7" fill="#FFF0F6" stroke="#B5197F" stroke-width="1.6"/>
<text x="540.0" y="645.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5A0C3E">Danh tính age (tạm thời)</text>
<text x="540.0" y="660.0" text-anchor="middle" font-size="10" fill="#5A0C3Ebb">giải mã tải trọng rồi bị hủy ngay trong một thao tác</text>
<rect x="730" y="616" width="320" height="62" rx="7" fill="#FFF0F6" stroke="#B5197F" stroke-width="1.6"/>
<text x="890.0" y="645.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5A0C3E">Khóa ký Ed25519 (tạm thời)</text>
<text x="890.0" y="660.0" text-anchor="middle" font-size="10" fill="#5A0C3Ebb">ký gốc ràng buộc rồi bị hủy ngay</text>
<rect x="60" y="560" width="260" height="118" rx="7" fill="#E3F5E7" stroke="#1E7B34" stroke-width="1.6"/>
<text x="190.0" y="605.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0E3A19">Chia ngưỡng khóa chủ</text>
<text x="190.0" y="619.5" text-anchor="middle" font-size="10" fill="#0E3A19bb">SssSharer.split(MK, n, k) → n mảnh 33 byte;</text>
<text x="190.0" y="632.0" text-anchor="middle" font-size="10" fill="#0E3A19bb">chỉ k mảnh mới khôi phục được MK; mảnh không</text>
<text x="190.0" y="644.5" text-anchor="middle" font-size="10" fill="#0E3A19bb">bao giờ nằm trong két</text>
<text x="60" y="716" text-anchor="start" font-size="11" font-weight="400" fill="#3a4a5a">Vì UUID két và nhãn trường đều nằm trong chuỗi ngữ cảnh, một khối bí mật đã bọc không thể bị mang sang két khác (chống cấy ghép) cũng không thể bị hoán đổi giữa hai trường (chống nhầm lẫn trường):</text>
<text x="60" y="730" text-anchor="start" font-size="11" font-weight="400" fill="#3a4a5a">ngữ cảnh sai sẽ dẫn xuất khóa sai và thẻ xác thực Poly1305 hỏng.</text>
<text class="src" x="26" y="774">Nguon: crates/sv-core/src/keys.rs (wrap_context, SUITE_VERSION); crates/sv-crypto/src/secretbox.rs; src-tauri/src/service.rs create/unlock</text>
