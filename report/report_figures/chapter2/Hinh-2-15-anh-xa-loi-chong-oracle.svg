<text x="1020.0" y="354.75" text-anchor="middle" font-size="12.5" font-weight="700" fill="#12305F">Giao diện</text>
<text x="1020.0" y="369.25" text-anchor="middle" font-size="10" fill="#12305Fbb">Bản đồ MESSAGES trong main.js dịch mã SV-* sang</text>
<text x="1020.0" y="381.75" text-anchor="middle" font-size="10" fill="#12305Fbb">thông điệp đã bản địa hóa. Kiểm thử ui_contract</text>
<text x="1020.0" y="394.25" text-anchor="middle" font-size="10" fill="#12305Fbb">khẳng định bản đồ này khớp 1:1 với</text>
<text x="1020.0" y="406.75" text-anchor="middle" font-size="10" fill="#12305Fbb">ApiError::ALL_CODES.</text>
<text x="50" y="756" text-anchor="start" font-size="11" font-weight="400" fill="#3a4a5a">Điểm tinh tế: kiểm tra SỐ LƯỢNG mảnh (InsufficientShares) là phép thử trước, không phải một lần thử chứng thực, nên nó có thể tách riêng mà không tạo ra oracle; còn việc mảnh có ĐÚNG hay không thì</text>
<text x="50" y="770" text-anchor="start" font-size="11" font-weight="400" fill="#3a4a5a">luôn hợp nhất vào SV-UNAUTHORIZED.</text>
