<text x="40" y="790.0" text-anchor="start" font-size="10.8" font-weight="400" fill="#3a4a5a">TB-1: không bí mật nào nằm trong DTO; lỗi trả về là mã SV-* đã hợp nhất để chống dò oracle. TB-2: nhị phân được ghim băm BLAKE3, chạy với môi trường đã xóa, không qua shell, có hạn giờ tường. TB-3: container được</text>
