<style>text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#1c2330}.ttl{font-size:20px;font-weight:700}.sub{font-size:12px;fill:#5b6675}.zl{font-size:12px;font-weight:700}.zs{font-size:10.5px;fill:#67707d}.el{font-size:10.5px;fill:#3a45060}.src{font-size:10px;fill:#77808c}</style>
<rect x="0" y="0" width="1180" height="750" fill="#ffffff"/>
<text class="ttl" x="26" y="34">Hình 3.5 — Mã hóa và giải mã tệp độc lập bằng mật khẩu (định dạng SVENC)</text>
<text class="sub" x="26" y="54">Đường này KHÔNG dùng age: chỉ Argon2id + secretbox, thuần Rust + libsodium</text>
<path d="M260 141.0 L545.0 141.0 L545.0 271.0 L830 271.0" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#arw)"/>
<rect x="527.175" y="126.5" width="65.65" height="17.5" rx="3" fill="#ffffffe0"/>
<text x="560" y="137.0" text-anchor="middle" font-size="10.5" fill="#3a5060">dữ liệu rõ</text>
<path d="M260 227.0 L310 227.0" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#arw)"/>
<path d="M155.0 282 L155.0 270.0 L415.0 270.0 L415.0 258" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#arw)"/>
