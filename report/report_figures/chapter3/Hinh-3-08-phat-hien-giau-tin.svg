<marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#44506080"/></marker>
<marker id="arwd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a94a4"/></marker>
<marker id="arwo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="none" stroke="#445060" stroke-width="1.4"/></marker>
</defs>
<style>text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#1c2330}.ttl{font-size:20px;font-weight:700}.sub{font-size:12px;fill:#5b6675}.zl{font-size:12px;font-weight:700}.zs{font-size:10.5px;fill:#67707d}.el{font-size:10.5px;fill:#3a45060}.src{font-size:10px;fill:#77808c}</style>
<rect x="0" y="0" width="1180" height="760" fill="#ffffff"/>
<text class="ttl" x="26" y="34">Hình 3.8 — Bảng các bộ dò giấu tin và cơ chế hợp nhất mức nghi ngờ</text>
<text class="sub" x="26" y="54">Kết quả là mức NGHI NGỜ theo phương pháp thực nghiệm, không bao giờ là kết luận &quot;ảnh sạch&quot;</text>
<rect x="50" y="200" width="540" height="250" rx="10" fill="#FFFAF2" stroke="#E3BC85" stroke-width="1.4" stroke-dasharray="6 4"/>
<text class="zl" x="62" y="219" fill="#3b4655">Bảng dò cho ảnh không mất mát (PNG / BMP)</text>
<rect x="630" y="200" width="520" height="180" rx="10" fill="#FFFAF2" stroke="#E3BC85" stroke-width="1.4" stroke-dasharray="6 4"/>
<text class="zl" x="642" y="219" fill="#3b4655">Bảng dò cho JPEG</text>
<path d="M270 141.0 L310 141.0" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#arw)"/>
<path d="M440.0 172 L440.0 208.0 L319.0 208.0 L319.0 244" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#arw)"/>
<path d="M440.0 172 L440.0 208.0 L891.0 208.0 L891.0 244" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#arw)"/>
<path d="M319.0 302 L604.5 302 L604.5 400 L890.0 400" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#arw)"/>
<path d="M319.0 370 L604.5 370 L604.5 400 L890.0 400" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#arw)"/>
<path d="M564 409.0 L597.0 409.0 L597.0 445.0 L630 445.0" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#arw)"/>
<path d="M891.0 302 L891.0 351.0 L890.0 351.0 L890.0 400" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#arw)"/>
<path d="M891.0 370 L891.0 385.0 L890.0 385.0 L890.0 400" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#arw)"/>
<path d="M890.0 490 L740.0 490 L740.0 512 L590.0 512" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#arw)"/>
<path d="M50 122.4 A110.0 12.4 0 0 1 270 122.4 L270 159.6 A110.0 12.4 0 0 1 50 159.6 Z" fill="#EAF6F6" stroke="#0F7B7B" stroke-width="1.6"/><path d="M50 122.4 A110.0 12.4 0 0 0 270 122.4" fill="none" stroke="#0F7B7B" stroke-width="1.6"/>
<text x="160.0" y="145.75" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0A3D3D">Tệp ảnh đầu vào</text>
<polygon points="440.0,110 570,141.0 440.0,172 310,141.0" fill="#E6F4EA" stroke="#2E7D46" stroke-width="1.6"/>
<text x="440.0" y="138.75" text-anchor="middle" font-size="11" font-weight="700" fill="#12401F">Phân nhánh theo vật chứa</text>
<text x="440.0" y="151.75" text-anchor="middle" font-size="10" fill="#12401Fbb">FF D8 FF ⇒ JPEG, ngược lại ⇒ PNG/BMP</text>
<rect x="74" y="244" width="490" height="58" rx="7" fill="#FFF4E5" stroke="#C77700" stroke-width="1.6"/>
<text x="319.0" y="271.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5A3600">AppendedDataDetector</text>
<text x="319.0" y="284.5" text-anchor="middle" font-size="10" fill="#5A3600bb">dữ liệu nằm sau EOF hợp lệ + entropy Shannon + quét chữ ký tệp nhúng</text>
<rect x="74" y="312" width="490" height="58" rx="7" fill="#FFF4E5" stroke="#C77700" stroke-width="1.6"/>
<text x="319.0" y="339.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5A3600">ChiSquareDetector</text>
<text x="319.0" y="352.5" text-anchor="middle" font-size="10" fill="#5A3600bb">kiểm định χ² trên cặp giá trị mẫu — dấu hiệu kinh điển của LSB tuần tự tỉ lệ cao</text>
<rect x="74" y="380" width="490" height="58" rx="7" fill="#FFF4E5" stroke="#C77700" stroke-width="1.6"/>
<text x="319.0" y="407.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5A3600">RsDetector</text>
<text x="319.0" y="420.5" text-anchor="middle" font-size="10" fill="#5A3600bb">phân tích Regular/Singular theo hàm lật, ước lượng tỉ lệ nhúng</text>
<rect x="654" y="244" width="474" height="58" rx="7" fill="#FFF4E5" stroke="#C77700" stroke-width="1.6"/>
<text x="891.0" y="271.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5A3600">jpeg_appended_signal</text>
<text x="891.0" y="284.5" text-anchor="middle" font-size="10" fill="#5A3600bb">dữ liệu nằm sau dấu EOI</text>
<rect x="654" y="312" width="474" height="58" rx="7" fill="#FFF4E5" stroke="#C77700" stroke-width="1.6"/>
<text x="891.0" y="339.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5A3600">jpeg_dct::analyze</text>
<text x="891.0" y="352.5" text-anchor="middle" font-size="10" fill="#5A3600bb">χ² trên LSB của hệ số DCT đã lượng tử — miền nhúng thật của JPEG</text>
<rect x="630" y="400" width="520" height="90" rx="7" fill="#E6F4EA" stroke="#2E7D46" stroke-width="1.6"/>
<text x="890.0" y="443.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#12401F">Hợp nhất: lấy điểm CAO NHẤT trong bảng</text>
<text x="890.0" y="458.0" text-anchor="middle" font-size="10" fill="#12401Fbb">≥ 0,75 → High · ≥ 0,45 → Elevated · ≥ 0,20 → Low · còn lại → NotObserved</text>
<rect x="310" y="512" width="560" height="92" rx="7" fill="#EAF6F6" stroke="#0F7B7B" stroke-width="1.6"/>
<text x="590.0" y="544.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0A3D3D">StegoDetectReport</text>
<text x="590.0" y="558.5" text-anchor="middle" font-size="10" fill="#0A3D3Dbb">suspicion + danh sách StegoSignal (tên bộ dò, điểm 0…1, diễn giải) + câu cảnh báo cố định: &quot;suy đoán</text>
<text x="590.0" y="571.0" text-anchor="middle" font-size="10" fill="#0A3D3Dbb">theo phương pháp thực nghiệm; nghi ngờ tăng không phải là bằng chứng, và không có tín hiệu cũng</text>
<text x="590.0" y="583.5" text-anchor="middle" font-size="10" fill="#0A3D3Dbb">không phải là bằng chứng vắng mặt&quot;</text>
<rect x="50" y="512" width="220" height="92" rx="7" fill="#FFFDE7" stroke="#B8A429" stroke-width="1.6"/>
<text x="160.0" y="556.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4A4210">Mức thấp nhất là NotObserved</text>
<text x="160.0" y="571.0" text-anchor="middle" font-size="10" fill="#4A4210bb">cố ý KHÔNG có mức &quot;Clean&quot;</text>
<text x="50" y="650" text-anchor="start" font-size="11" font-weight="400" fill="#3a4a5a">Phạm vi trung thực do chính tài liệu của mô-đun ghi nhận: bảng dò này bắt tốt các trường hợp giấu tin thô sơ, tỉ lệ nhúng cao hoặc kiểu &quot;nối thêm tệp vào sau ảnh&quot;. Một tải trọng sv-stego đã mã hóa,</text>
<text x="50" y="664" text-anchor="start" font-size="11" font-weight="400" fill="#3a4a5a">hoán vị và tỉ lệ nhúng thấp thì gần như không bị các bộ dò này phát hiện — đó là sự thật, và cũng chính là lý do kết quả được trình bày dưới dạng mức nghi ngờ chứ không phải một phán quyết.</text>
<text class="src" x="26" y="734">Nguồn: crates/sv-stego/src/detect/{mod,appended,chi_square,rs,jpeg_dct}.rs; sv_types::{StegoSignal, StegoDetectReport, Suspicion}</text>
</svg>