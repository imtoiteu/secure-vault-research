<text x="295.0" y="842.25" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0E3A19">.github/workflows/ci.yml</text>
<text x="434" y="182.0" text-anchor="start" font-size="10.6" font-weight="400" fill="#3a4a5a">khai báo workspace, phiên bản phụ thuộc dùng chung, lint toàn cục</text>
<text x="434" y="226.0" text-anchor="start" font-size="10.6" font-weight="400" fill="#3a4a5a">cố định phiên bản trình biên dịch và chính sách chuỗi cung ứng</text>
<text x="474" y="270.0" text-anchor="start" font-size="10.6" font-weight="400" fill="#3a4a5a">791 dòng — DTO IPC/UI, ApiError 12 mã, nameframe</text>
<text x="474" y="314.0" text-anchor="start" font-size="10.6" font-weight="400" fill="#3a4a5a">449 dòng — ABI: trait, kiểu giá trị bí mật, định danh thuật toán</text>
<text x="474" y="358.0" text-anchor="start" font-size="10.6" font-weight="400" fill="#3a4a5a">214 dòng — FFI libsodium (sign, blake2b, secretbox)</text>
<text x="474" y="402.0" text-anchor="start" font-size="10.6" font-weight="400" fill="#3a4a5a">155 dòng + hazmat.c — FFI Shamir, randombytes nối vào getrandom</text>
<text x="474" y="446.0" text-anchor="start" font-size="10.6" font-weight="400" fill="#3a4a5a">668 dòng — Blake3Hasher, Argon2Kdf, SssSharer, minisign, secretbox, policy</text>
<text x="474" y="490.0" text-anchor="start" font-size="10.6" font-weight="400" fill="#3a4a5a">426 dòng — bộ điều hợp FileCipher trên tiến trình con age</text>
<text x="474" y="534.0" text-anchor="start" font-size="10.6" font-weight="400" fill="#3a4a5a">1 316 dòng — format, container, keys, service, error của két .svault</text>
<text x="474" y="578.0" text-anchor="start" font-size="10.6" font-weight="400" fill="#3a4a5a">1 945 dòng — artifact, crypto, integrity, sharing (không phụ thuộc két)</text>
<text x="474" y="622.0" text-anchor="start" font-size="10.6" font-weight="400" fill="#3a4a5a">≈2 490 dòng — carrier, embed, selector, envelope, seal, pipeline, detect</text>
<text x="474" y="666.0" text-anchor="start" font-size="10.6" font-weight="400" fill="#3a4a5a">610 + 807 + 289 dòng — thủy vân, ExifTool, mã QR</text>
<text x="474" y="710.0" text-anchor="start" font-size="10.6" font-weight="400" fill="#3a4a5a">1 990 dòng — gốc lắp ghép, 5 bề mặt lệnh, IpcPassphrase, VaultBackend</text>
<text x="474" y="754.0" text-anchor="start" font-size="10.6" font-weight="400" fill="#3a4a5a">vỏ Tauri 2: build.rs (363 dòng), src/lib.rs (716 dòng), frontend tĩnh</text>
<text x="474" y="798.0" text-anchor="start" font-size="10.6" font-weight="400" fill="#3a4a5a">18 tài liệu thiết kế + docs/architecture/ 10 chương kiến trúc</text>
<text x="474" y="842.0" text-anchor="start" font-size="10.6" font-weight="400" fill="#3a4a5a">5 nhóm việc CI: check (3 hệ điều hành), msrv, desktop, supply-chain, sbom</text>
<text x="60" y="892" text-anchor="start" font-size="11" font-weight="400" fill="#3a4a5a">Quy ước phân tách quan trọng nhất: thư mục desktop/ được khai báo exclude trong workspace. Nhờ vậy cây phụ thuộc rất nặng của webview không đi vào cổng kiểm toán (cargo deny / cargo audit /</text>
<text x="60" y="906" text-anchor="start" font-size="11" font-weight="400" fill="#3a4a5a">cargo build --locked) của phần lõi mật mã, và phần lõi vẫn kiểm thử được trên máy không có bộ công cụ Tauri.</text>
<text class="src" x="26" y="834">Nguồn: Cargo.toml (members, exclude), cây thư mục crates/, src-tauri/, desktop/, docs/</text>
</svg>