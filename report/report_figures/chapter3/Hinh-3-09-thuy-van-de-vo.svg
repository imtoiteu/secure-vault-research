<path d="M494 610.0 L540 598.0" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#arw)"/>
<rect x="506.435" y="585.5" width="21.130000000000003" height="17.5" rx="3" fill="#ffffffe0"/>
<text x="517.0" y="596.0" text-anchor="middle" font-size="10.5" fill="#3a5060">có</text>
<path d="M494 610.0 L840 598.0" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#arw)"/>
<rect x="881.0875" y="616.5" width="37.825" height="17.5" rx="3" fill="#ffffffe0"/>
<text x="900" y="627.0" text-anchor="middle" font-size="10.5" fill="#3a5060">không</text>
<rect x="50" y="110" width="230" height="58" rx="7" fill="#FFF0F6" stroke="#B5197F" stroke-width="1.6"/>
<text x="165.0" y="143.75" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5A0C3E">Mật khẩu người dùng</text>
<rect x="310" y="110" width="230" height="58" rx="7" fill="#F3E8FD" stroke="#7A3FBF" stroke-width="1.6"/>
<text x="425.0" y="131.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3A1560">Argon2id + muối cố định</text>
<text x="425.0" y="145.75" text-anchor="middle" font-size="10" fill="#3A1560bb">muối chỉ để tách miền, không chống bảng</text>
<text x="425.0" y="158.25" text-anchor="middle" font-size="10" fill="#3A1560bb">cầu vồng</text>
<rect x="570" y="110" width="200" height="58" rx="7" fill="#FFF0F6" stroke="#B5197F" stroke-width="1.6"/>
<text x="670.0" y="137.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5A0C3E">Khóa K (32 byte)</text>
<text x="670.0" y="152.0" text-anchor="middle" font-size="10" fill="#5A0C3Ebb">không bao giờ được lưu</text>
<rect x="74" y="234" width="320" height="76" rx="7" fill="#FFF4E5" stroke="#C77700" stroke-width="1.6"/>
<text x="234.0" y="264.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5A3600">Chia ảnh thành khối 16 × 16</text>
<text x="234.0" y="278.75" text-anchor="middle" font-size="10" fill="#5A3600bb">hàng/cột cuối hấp thụ phần dư nên mọi khối đều ≥ 16 px</text>
<text x="234.0" y="291.25" text-anchor="middle" font-size="10" fill="#5A3600bb">mỗi cạnh</text>
<rect x="420" y="234" width="340" height="76" rx="7" fill="#F3E8FD" stroke="#7A3FBF" stroke-width="1.6"/>
<text x="590.0" y="264.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3A1560">Nhãn từng khối</text>
<text x="590.0" y="278.75" text-anchor="middle" font-size="10" fill="#3A1560bb">BLAKE3::keyed_hash(K, ngữ cảnh ‖ W ‖ H ‖ bx ‖ by ‖ nội</text>
<text x="590.0" y="291.25" text-anchor="middle" font-size="10" fill="#3A1560bb">dung)</text>
<rect x="790" y="234" width="336" height="76" rx="7" fill="#FFF4E5" stroke="#C77700" stroke-width="1.6"/>
<text x="958.0" y="264.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5A3600">&quot;Nội dung&quot; = 7 bit CAO của R, G, B</text>
<text x="958.0" y="278.75" text-anchor="middle" font-size="10" fill="#5A3600bb">mặt bit thấp nhất bị loại khỏi phép băm nên nhúng không làm</text>
<text x="958.0" y="291.25" text-anchor="middle" font-size="10" fill="#5A3600bb">đổi nhãn</text>
<rect x="74" y="330" width="500" height="88" rx="7" fill="#FFF4E5" stroke="#C77700" stroke-width="1.6"/>
<text x="324.0" y="372.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5A3600">Rải 256 bit nhãn lên mặt LSB kênh LAM của khối</text>
<text x="324.0" y="387.0" text-anchor="middle" font-size="10" fill="#5A3600bb">mọi LSB lam trong khối trở thành một bit nhãn ⇒ mọi sửa đổi nội dung đều làm hỏng nhãn</text>
<rect x="600" y="330" width="526" height="88" rx="7" fill="#FFF4E5" stroke="#C77700" stroke-width="1.6"/>
<text x="863.0" y="366.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5A3600">Dấu hiệu hiện diện trên mặt LSB kênh LỤC</text>
<text x="863.0" y="380.75" text-anchor="middle" font-size="10" fill="#5A3600bb">chuỗi có khóa nhưng ĐỘC LẬP nội dung, dẫn từ K ‖ W ‖ H — cho phép trả lời câu hỏi &quot;ảnh này có</text>
<text x="863.0" y="393.25" text-anchor="middle" font-size="10" fill="#5A3600bb">mang dấu của khóa này không&quot; ngay cả khi mọi khối nội dung đều hỏng</text>
<polygon points="284.0,500 494,530.0 284.0,560 74,530.0" fill="#E6F4EA" stroke="#2E7D46" stroke-width="1.6"/>
<text x="284.0" y="534.25" text-anchor="middle" font-size="11.5" font-weight="700" fill="#12401F">Bit dấu hiệu khớp ≥ 75 %?</text>
<rect x="540" y="490" width="260" height="56" rx="7" fill="#FFFDE7" stroke="#B8A429" stroke-width="1.6"/>
<text x="670.0" y="510.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4A4210">NotWatermarked</text>
<text x="670.0" y="524.75" text-anchor="middle" font-size="10" fill="#4A4210bb">chưa đánh dấu, sai khóa, hoặc dấu bị phá hoàn</text>
<text x="670.0" y="537.25" text-anchor="middle" font-size="10" fill="#4A4210bb">toàn</text>
<polygon points="284.0,580 494,610.0 284.0,640 74,610.0" fill="#E6F4EA" stroke="#2E7D46" stroke-width="1.6"/>
<text x="284.0" y="614.25" text-anchor="middle" font-size="11.5" font-weight="700" fill="#12401F">Mọi khối tái tính đều khớp?</text>
<rect x="540" y="570" width="260" height="56" rx="7" fill="#E3F5E7" stroke="#1E7B34" stroke-width="1.6"/>
<text x="670.0" y="596.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0E3A19">Intact</text>
<text x="670.0" y="611.0" text-anchor="middle" font-size="10" fill="#0E3A19bb">ảnh nguyên vẹn từng bit</text>
<rect x="840" y="570" width="286" height="56" rx="7" fill="#FCE4E4" stroke="#B3261E" stroke-width="1.6"/>
<text x="983.0" y="590.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5E1611">Tampered</text>
<text x="983.0" y="604.75" text-anchor="middle" font-size="10" fill="#5E1611bb">kèm danh sách khối hỏng ⇒ định vị được vùng bị</text>
<text x="983.0" y="617.25" text-anchor="middle" font-size="10" fill="#5E1611bb">sửa</text>
<text x="50" y="720" text-anchor="start" font-size="11" font-weight="400" fill="#3a4a5a">Đây là thủy vân DỄ VỠ: bất kỳ thao tác biên tập nào — kể cả nén lại sang JPEG — đều làm hỏng dấu. Đó là ĐẶC TÍNH chứ không phải khuyết điểm: mục tiêu là phát hiện sửa đổi, không phải chứng minh bản</text>
<text x="50" y="734" text-anchor="start" font-size="11" font-weight="400" fill="#3a4a5a">quyền. Họ thủy vân bền vững (DWT-DCT-SVD) được ghi nhận là hướng nghiên cứu hoãn lại vì chưa có thư viện biến đổi sóng con hai chiều thuần Rust đủ tin cậy.</text>
<text class="src" x="26" y="774">Nguồn: crates/sv-watermark/src/lib.rs (BLOCK, PRESENCE_THRESHOLD, BLOCK_CONTEXT, PRESENCE_CONTEXT, WATERMARK_SALT)</text>
</svg>