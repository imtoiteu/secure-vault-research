<text class="ttl" x="26" y="34">Hình 3.9 — Thủy vân vô hình, có khóa, dễ vỡ: nhúng và kiểm tra</text>
<text class="sub" x="26" y="54">Không phải giấu tin (không mang tải trọng) và cố ý KHÔNG bền vững — mục tiêu là bằng chứng sửa đổi</text>
<rect x="50" y="190" width="1100" height="250" rx="10" fill="#F4FBF6" stroke="#9CCBA9" stroke-width="1.4" stroke-dasharray="6 4"/>
<text class="zl" x="62" y="209" fill="#3b4655">Nhúng (watermark_embed) — chỉ ảnh PNG / BMP</text>
<rect x="50" y="456" width="1100" height="230" rx="10" fill="#FFFAF2" stroke="#E3BC85" stroke-width="1.4" stroke-dasharray="6 4"/>
<text class="zl" x="62" y="475" fill="#3b4655">Kiểm tra (watermark_verify) — thang phán quyết ba mức</text>
