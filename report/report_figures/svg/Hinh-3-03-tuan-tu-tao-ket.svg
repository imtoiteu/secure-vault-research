<text x="132" y="155.5" text-anchor="start" font-size="10.4" font-weight="400" fill="#2f3d4c">vault_create(path, IpcPassphrase,</text>
<text x="132" y="168.9" text-anchor="start" font-size="10.4" font-weight="400" fill="#2f3d4c">Option&lt;SharePolicy&gt;)</text>
<text x="348" y="220.0" text-anchor="start" font-size="10.4" font-weight="400" fill="#2f3d4c">Kiểm tra chính sách chia mảnh: 2 ≤ shares_total, 1 ≤ threshold ≤ shares_total</text>
<text x="342" y="242.5" text-anchor="start" font-size="10.4" font-weight="400" fill="#2f3d4c">Sinh vault_uuid 16 byte và muối</text>
<text x="342" y="255.9" text-anchor="start" font-size="10.4" font-weight="400" fill="#2f3d4c">Argon2id 16 byte</text>
<text x="348" y="307.0" text-anchor="start" font-size="10.4" font-weight="400" fill="#2f3d4c">Argon2id(mật khẩu, muối, tham số mặc định 256 MiB / t=3 / p=1) → khóa chủ MK</text>
<text x="342" y="342.0" text-anchor="start" font-size="10.4" font-weight="400" fill="#2f3d4c">generate_identity(): chạy age-keygen với môi trường đã xóa</text>
<text x="342" y="374.0" text-anchor="start" font-size="10.4" font-weight="400" fill="#2f3d4c">(AGE-SECRET-KEY-1…, age1… ) — danh tính bí mật và người nhận công khai</text>
<text x="342" y="406.0" text-anchor="start" font-size="10.4" font-weight="400" fill="#2f3d4c">generate(): sinh cặp khóa Ed25519 64 byte / 32 byte</text>
<text x="348" y="445.0" text-anchor="start" font-size="10.4" font-weight="400" fill="#2f3d4c">Bọc hai bí mật: derive_wrap_key(MK, &lt;trường&gt;, uuid) rồi secretbox::seal</text>
<text x="348" y="487.0" text-anchor="start" font-size="10.4" font-weight="400" fill="#2f3d4c">Dựng VaultHeader: suite V1, uuid, kdf, hai khối đã bọc, khóa công khai ký, chính sách</text>
<text x="342" y="522.0" text-anchor="start" font-size="10.4" font-weight="400" fill="#2f3d4c">pack_archive(danh sách mục rỗng) → DIR_LEN ‖ CBOR(ItemDirectory rỗng)</text>
<text x="342" y="554.0" text-anchor="start" font-size="10.4" font-weight="400" fill="#2f3d4c">encrypt(archive, recipient) rồi encode(): tính gốc ràng buộc và ký</text>
<text x="342" y="586.0" text-anchor="start" font-size="10.4" font-weight="400" fill="#2f3d4c">write_atomic(path): tệp tạm cùng thư mục → fsync → rename</text>
<text x="132" y="593.0" text-anchor="start" font-size="10.4" font-weight="400" fill="#2f3d4c">VaultMeta { vault_uuid,</text>
<text x="132" y="606.4" text-anchor="start" font-size="10.4" font-weight="400" fill="#2f3d4c">format_version, item_count = 0, kdf,</text>
<text x="132" y="619.8" text-anchor="start" font-size="10.4" font-weight="400" fill="#2f3d4c">share_policy }</text>
<text x="40" y="70" text-anchor="start" font-size="11" font-weight="400" fill="#3a4a5a">Nếu chính sách khôi phục được bật, các mảnh KHÔNG được sinh ở bước này: két chỉ ghi lại chính sách (n, k); mảnh thật chỉ được cắt khi người dùng gọi keys_split trên một phiên đã mở khóa.</text>
<text class="src" x="26" y="804">Nguồn: src-tauri/src/service.rs create(); src-tauri/src/payload.rs generate_identity(); crates/sv-crypto/src/lib.rs SodiumMinisignSigner::generate</text>
</svg>