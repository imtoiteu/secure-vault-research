<text x="420" y="117.0" text-anchor="middle" font-size="10.5" fill="#3a5060">dữ liệu rõ đã đóng khung</text>
<path d="M540 165.0 L580 201.0" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#arw)"/>
<path d="M540 237.0 L580 201.0" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#arw)"/>
<path d="M840 201.0 L880 201.0" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#arw)"/>
<path d="M1005.0 230 L857.5 230 L857.5 288 L710.0 288" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#arw)"/>
<path d="M840 324.0 L880 324.0" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#arw)"/>
