<rect x="249.8725" y="256.5" width="160.255" height="17.5" rx="3" fill="#ffffffe0"/>
<text x="330" y="267.0" text-anchor="middle" font-size="10.5" fill="#3a5060">SssSharer::split(DEK, n, k)</text>
<path d="M880 324.0 L717.0 324.0 L717.0 324.0 L554 324.0" fill="none" stroke="#8a94a4" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arwd)"/>
<rect x="74" y="136" width="220" height="58" rx="7" fill="#FFF0F6" stroke="#B5197F" stroke-width="1.6"/>
<text x="184.0" y="157.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5A0C3E">Bí mật tùy độ dài</text>
<text x="184.0" y="171.75" text-anchor="middle" font-size="10" fill="#5A0C3Ebb">chuỗi người dùng gõ, hoặc nội dung</text>
<text x="184.0" y="184.25" text-anchor="middle" font-size="10" fill="#5A0C3Ebb">tệp</text>
<rect x="74" y="208" width="220" height="58" rx="7" fill="#FFF4E5" stroke="#C77700" stroke-width="1.6"/>
<text x="184.0" y="229.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5A3600">nameframe::frame</text>
<text x="184.0" y="243.75" text-anchor="middle" font-size="10" fill="#5A3600bb">gắn tên tệp gốc VÀO BÊN TRONG vùng sẽ</text>
<text x="184.0" y="256.25" text-anchor="middle" font-size="10" fill="#5A3600bb">mã hóa</text>
<rect x="340" y="136" width="200" height="58" rx="7" fill="#FFF0F6" stroke="#B5197F" stroke-width="1.6"/>
<text x="440.0" y="163.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5A0C3E">DEK 32 byte ngẫu nhiên</text>
<text x="440.0" y="178.0" text-anchor="middle" font-size="10" fill="#5A0C3Ebb">getrandom</text>
<rect x="340" y="208" width="200" height="58" rx="7" fill="#FFFFFF" stroke="#5B6675" stroke-width="1.6"/>
<text x="440.0" y="235.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1C2330">group_id 16 byte</text>
<text x="440.0" y="250.0" text-anchor="middle" font-size="10" fill="#1C2330bb">thay cho UUID két</text>
<rect x="580" y="172" width="260" height="58" rx="7" fill="#F3E8FD" stroke="#7A3FBF" stroke-width="1.6"/>
<text x="710.0" y="199.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3A1560">derive_payload_key</text>
<text x="710.0" y="214.0" text-anchor="middle" font-size="10" fill="#3A1560bb">BLAKE3(&quot;…/SVSS|group|n|k&quot;, DEK)</text>
<rect x="880" y="172" width="250" height="58" rx="7" fill="#F3E8FD" stroke="#7A3FBF" stroke-width="1.6"/>
<text x="1005.0" y="199.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3A1560">secretbox::seal</text>
<text x="1005.0" y="214.0" text-anchor="middle" font-size="10" fill="#3A1560bb">nonce 24 B + thẻ 16 B</text>
<rect x="580" y="288" width="260" height="72" rx="7" fill="#EAF6F6" stroke="#0F7B7B" stroke-width="1.6"/>
<text x="710.0" y="316.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0A3D3D">Tệp tải trọng SVSSP</text>
<text x="710.0" y="330.75" text-anchor="middle" font-size="10" fill="#0A3D3Dbb">MAGIC (6) ‖ ver (2) ‖ aead_alg (1) ‖ nonce</text>
<text x="710.0" y="343.25" text-anchor="middle" font-size="10" fill="#0A3D3Dbb">(24) ‖ ciphertext</text>
<rect x="880" y="288" width="250" height="72" rx="7" fill="#F3E8FD" stroke="#7A3FBF" stroke-width="1.6"/>
<text x="1005.0" y="314.75" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3A1560">payload_ref = BLAKE3(cả tệp tải</text>
<text x="1005.0" y="330.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3A1560">trọng)</text>
<text x="1005.0" y="344.75" text-anchor="middle" font-size="10" fill="#3A1560bb">ràng buộc từng mảnh với đúng tải trọng này</text>
<rect x="74" y="288" width="480" height="72" rx="7" fill="#EAF6F6" stroke="#0F7B7B" stroke-width="1.6"/>
<text x="314.0" y="316.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0A3D3D">n tệp mảnh SVSSS — mỗi tệp đúng 92 byte</text>
<text x="314.0" y="330.75" text-anchor="middle" font-size="10" fill="#0A3D3Dbb">MAGIC (6) ‖ ver (2) ‖ group_id (16) ‖ n (1) ‖ k (1) ‖ index (1) ‖ payload_ref (32) ‖</text>
<text x="314.0" y="343.25" text-anchor="middle" font-size="10" fill="#0A3D3Dbb">mảnh (33)</text>
<rect x="74" y="444" width="700" height="36" rx="7" fill="#E3F5E7" stroke="#1E7B34" stroke-width="1.6"/>
<text x="424.0" y="465.90000000000003" text-anchor="middle" font-size="10.8" font-weight="500" fill="#0E3A19">1. Đồng thuận: mọi mảnh phải cùng group_id, cùng n, k, cùng payload_ref</text>
<rect x="74" y="484" width="700" height="36" rx="7" fill="#E3F5E7" stroke="#1E7B34" stroke-width="1.6"/>
<text x="424.0" y="505.90000000000003" text-anchor="middle" font-size="10.8" font-weight="500" fill="#0E3A19">2. Trùng hoành độ: hai mảnh cùng x làm phép nội suy Lagrange suy biến ⇒ từ chối ngay</text>
<rect x="74" y="524" width="700" height="36" rx="7" fill="#E3F5E7" stroke="#1E7B34" stroke-width="1.6"/>
<text x="424.0" y="545.9" text-anchor="middle" font-size="10.8" font-weight="500" fill="#0E3A19">3. Hoành độ khác 0: mảnh thật không bao giờ dùng x = 0 (bí mật nằm tại x = 0)</text>
<rect x="74" y="564" width="700" height="36" rx="7" fill="#E3F5E7" stroke="#1E7B34" stroke-width="1.6"/>
<text x="424.0" y="585.9" text-anchor="middle" font-size="10.8" font-weight="500" fill="#0E3A19">4. Đếm số mảnh: got &lt; k ⇒ SV-INSUFFICIENT-SHARES { got, need }</text>
<rect x="74" y="604" width="700" height="36" rx="7" fill="#E3F5E7" stroke="#1E7B34" stroke-width="1.6"/>
<text x="424.0" y="625.9" text-anchor="middle" font-size="10.8" font-weight="500" fill="#0E3A19">5. Ràng buộc tải trọng: BLAKE3(tệp tải trọng) phải khớp payload_ref trong mảnh</text>
<rect x="800" y="470" width="330" height="130" rx="7" fill="#FFF0F6" stroke="#B5197F" stroke-width="1.6"/>
<text x="965.0" y="521.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5A0C3E">Cổng mật mã cuối cùng</text>
<text x="965.0" y="535.5" text-anchor="middle" font-size="10" fill="#5A0C3Ebb">combine → DEK → derive_payload_key(group_id, n, k) →</text>
<text x="965.0" y="548.0" text-anchor="middle" font-size="10" fill="#5A0C3Ebb">secretbox::open. Mọi thất bại tại đây đều là SV-</text>
<text x="965.0" y="560.5" text-anchor="middle" font-size="10" fill="#5A0C3Ebb">UNAUTHORIZED, không phân biệt sai mảnh hay bản mã bị sửa.</text>
<rect x="74" y="646" width="700" height="44" rx="7" fill="#EAF6F6" stroke="#0F7B7B" stroke-width="1.6"/>
<text x="424.0" y="672.0" text-anchor="middle" font-size="11" font-weight="700" fill="#0A3D3D">Mỗi mảnh còn được xuất thành chuỗi Base64 124 ký tự để chép tay, và có thể in thành ảnh QR PNG (mức sửa lỗi H)</text>
<text x="50" y="736" text-anchor="start" font-size="11" font-weight="400" fill="#3a4a5a">Vì secretbox không nhận dữ liệu liên kết (AAD), tính toàn vẹn của phần header không được bảo vệ bằng AAD mà bằng cách gấp bộ ba (group_id, n, k) vào chính chuỗi ngữ cảnh dẫn xuất khóa tải trọng. Sửa</text>
<text x="50" y="750" text-anchor="start" font-size="11" font-weight="400" fill="#3a4a5a">bất kỳ byte nào trong ba trường đó sẽ dẫn xuất ra khóa khác và thẻ Poly1305 lập tức hỏng — đây chính là thuộc tính chịu lực của lược đồ.</text>
<text class="src" x="26" y="794">Nguồn: crates/sv-platform/src/sharing.rs split_core/recover_core/derive_payload_key, encode_share_string; crates/sv-qr/src/lib.rs</text>
</svg>