<text class="ttl" x="26" y="34">Hình 3.6 — Lược đồ chia sẻ bí mật lai: Shamir trên DEK + AEAD trên tải trọng</text>
<text class="sub" x="26" y="54">Vì sao phải lai: nguyên thủy sss chỉ chia được đúng một khóa 32 byte</text>
<rect x="50" y="90" width="1100" height="290" rx="10" fill="#F4FBF6" stroke="#9CCBA9" stroke-width="1.4" stroke-dasharray="6 4"/>
<text class="zl" x="62" y="109" fill="#3b4655">Chia (split_secret / split_file)</text>
<rect x="50" y="402" width="1100" height="300" rx="10" fill="#FFFAF2" stroke="#E3BC85" stroke-width="1.4" stroke-dasharray="6 4"/>
<text class="zl" x="62" y="421" fill="#3b4655">Khôi phục (recover_secret) — năm cổng kiểm tra không bí mật rồi mới tới AEAD</text>
