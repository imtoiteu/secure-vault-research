<rect x="76" y="136" width="220" height="60" rx="7" fill="#FFF0F6" stroke="#B5197F" stroke-width="1.6"/>
<text x="186.0" y="164.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5A0C3E">Khóa chủ MK (32 byte)</text>
<text x="186.0" y="179.0" text-anchor="middle" font-size="10" fill="#5A0C3Ebb">lấy từ bảng phiên</text>
<rect x="330" y="136" width="236" height="60" rx="7" fill="#F3E8FD" stroke="#7A3FBF" stroke-width="1.6"/>
<text x="448.0" y="164.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3A1560">SssSharer::split(MK, n, k)</text>
<text x="448.0" y="179.0" text-anchor="middle" font-size="10" fill="#3A1560bb">Shamir trên GF(2⁸), mảnh đã xác thực</text>
<rect x="76" y="216" width="490" height="56" rx="7" fill="#FFF0F6" stroke="#B5197F" stroke-width="1.6"/>
<text x="321.0" y="248.75" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5A0C3E">n mảnh, mỗi mảnh 33 byte (byte đầu là hoành độ x)</text>
<rect x="76" y="288" width="490" height="84" rx="7" fill="#EAF6F6" stroke="#0F7B7B" stroke-width="1.6"/>
<text x="321.0" y="322.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0A3D3D">Phong bì SVSH — 58 byte cố định</text>
<text x="321.0" y="336.75" text-anchor="middle" font-size="10" fill="#0A3D3Dbb">MAGIC &quot;SVSH&quot; (4) ‖ version u16 LE (2) ‖ vault_uuid (16) ‖ index (1) ‖ total (1) ‖</text>
<text x="321.0" y="349.25" text-anchor="middle" font-size="10" fill="#0A3D3Dbb">threshold (1) ‖ mảnh (33)</text>
<rect x="646" y="136" width="490" height="52" rx="7" fill="#E6F4EA" stroke="#2E7D46" stroke-width="1.6"/>
<text x="891.0" y="166.25" text-anchor="middle" font-size="11.5" font-weight="700" fill="#12401F">Đọc k phong bì; kiểm MAGIC, phiên bản, độ dài</text>
<rect x="646" y="200" width="490" height="52" rx="7" fill="#E6F4EA" stroke="#2E7D46" stroke-width="1.6"/>
<text x="891.0" y="224.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#12401F">Đối chiếu vault_uuid trong mảnh với uuid trong header két</text>
<text x="891.0" y="237.5" text-anchor="middle" font-size="10" fill="#12401Fbb">lệch ⇒ SV-INVALID-INPUT &quot;mảnh thuộc két khác&quot;</text>
<rect x="646" y="264" width="490" height="46" rx="7" fill="#E3F5E7" stroke="#1E7B34" stroke-width="1.6"/>
<text x="891.0" y="291.0" text-anchor="middle" font-size="11" font-weight="700" fill="#0E3A19">Kiểm số lượng: got &lt; threshold ⇒ SV-INSUFFICIENT-SHARES { got, need }</text>
<rect x="646" y="322" width="490" height="50" rx="7" fill="#F3E8FD" stroke="#7A3FBF" stroke-width="1.6"/>
<text x="891.0" y="351.25" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3A1560">SssSharer::combine → MK ứng viên</text>
<rect x="330" y="430" width="540" height="78" rx="7" fill="#FFF0F6" stroke="#B5197F" stroke-width="1.6"/>
<text x="600.0" y="467.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5A0C3E">Cổng tín nhiệm chung: secretbox::open(wrapped_age_identity)</text>
<text x="600.0" y="482.0" text-anchor="middle" font-size="10" fill="#5A0C3Ebb">thất bại ⇒ SV-UNAUTHORIZED — cùng một mã với trường hợp sai mật khẩu</text>
<rect x="330" y="534" width="540" height="60" rx="7" fill="#E6F4EA" stroke="#2E7D46" stroke-width="1.6"/>
<text x="600.0" y="562.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#12401F">Tạo phiên mới ↦ (MK, đường dẫn két)</text>
<text x="600.0" y="577.0" text-anchor="middle" font-size="10" fill="#12401Fbb">từ đây mọi thao tác giống hệt phiên mở bằng mật khẩu</text>
<path d="M76 444 A110.0 14 0 0 1 296 444 L296 494 A110.0 14 0 0 1 76 494 Z" fill="#EAF6F6" stroke="#0F7B7B" stroke-width="1.6"/><path d="M76 444 A110.0 14 0 0 0 296 444" fill="none" stroke="#0F7B7B" stroke-width="1.6"/>
<text x="186.0" y="467.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0A3D3D">Thư mục xuất mảnh</text>
<text x="186.0" y="482.0" text-anchor="middle" font-size="10" fill="#0A3D3Dbb">&lt;uuid&gt;.share1.svshare …</text>
<text x="50" y="640" text-anchor="start" font-size="11" font-weight="400" fill="#3a4a5a">Hai thuộc tính đáng chú ý. Thứ nhất, ngưỡng là tính chất của lược đồ Shamir chứ không phải của phần mềm: với ít hơn k mảnh, thư viện vẫn trả về một khóa 32 byte nhưng là khóa SAI — bằng chứng là kiểm</text>
<text x="50" y="654" text-anchor="start" font-size="11" font-weight="400" fill="#3a4a5a">thử sss_below_threshold_yields_wrong_key. Thứ hai, vì thế phép kiểm tra thực sự nằm ở cổng mở bọc AEAD phía sau, chứ không nằm ở phép so sánh nào trên chính các mảnh.</text>
<text class="src" x="26" y="754">Nguồn: src-tauri/src/service.rs split_key/recover, build_share_envelope/parse_share_envelope; crates/sv-crypto/src/lib.rs SssSharer</text>
</svg>