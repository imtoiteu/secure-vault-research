<path d="M321.0 372 L321.0 401.0 L186.0 401.0 L186.0 430" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#arw)"/>
<rect x="138.8275" y="396.5" width="82.345" height="17.5" rx="3" fill="#ffffffe0"/>
<text x="180" y="407.0" text-anchor="middle" font-size="10.5" fill="#3a5060">ghi nguyên tử</text>
<path d="M891.0 188 L891.0 200" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#arw)"/>
<path d="M891.0 252 L891.0 264" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#arw)"/>
