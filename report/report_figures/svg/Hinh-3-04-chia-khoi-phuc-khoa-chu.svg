<text class="ttl" x="26" y="34">Hình 3.4 — Chia và khôi phục khóa chủ của két theo ngưỡng k trong n</text>
<text class="sub" x="26" y="54">Phong bì mảnh SVSH 58 byte; mảnh không bao giờ được lưu trong két</text>
<rect x="50" y="90" width="540" height="300" rx="10" fill="#F4FBF6" stroke="#9CCBA9" stroke-width="1.4" stroke-dasharray="6 4"/>
<text class="zl" x="62" y="109" fill="#3b4655">Đường chia (keys_split, cần phiên đã mở khóa)</text>
<rect x="620" y="90" width="540" height="300" rx="10" fill="#FFFAF2" stroke="#E3BC85" stroke-width="1.4" stroke-dasharray="6 4"/>
<text class="zl" x="632" y="109" fill="#3b4655">Đường khôi phục (keys_recover, KHÔNG cần mật khẩu)</text>
<path d="M296 166.0 L330 166.0" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#arw)"/>
<path d="M448.0 196 L448.0 206.0 L321.0 206.0 L321.0 216" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#arw)"/>
