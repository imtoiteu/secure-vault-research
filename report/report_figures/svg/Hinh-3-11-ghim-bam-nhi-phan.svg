<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-label="Hình 3.11 — Ghim băm nhị phân ngoài lúc biên dịch và phân giải lúc chạy">
<defs>
<marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#44506080"/></marker>
<marker id="arwd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a94a4"/></marker>
<marker id="arwo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="none" stroke="#445060" stroke-width="1.4"/></marker>
</defs>
<style>text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#1c2330}.ttl{font-size:20px;font-weight:700}.sub{font-size:12px;fill:#5b6675}.zl{font-size:12px;font-weight:700}.zs{font-size:10.5px;fill:#67707d}.el{font-size:10.5px;fill:#3a45060}.src{font-size:10px;fill:#77808c}</style>
<rect x="0" y="0" width="1200" height="780" fill="#ffffff"/>
<text class="ttl" x="26" y="34">Hình 3.11 — Ghim băm nhị phân ngoài lúc biên dịch và phân giải lúc chạy</text>
<text class="sub" x="26" y="54">Chuỗi kiểm soát chuỗi cung ứng: nạp → ghim → kiểm kiến trúc → phân giải → xác minh lại → chạy có rào</text>
<rect x="50" y="92" width="1100" height="250" rx="10" fill="#F4FBF6" stroke="#9CCBA9" stroke-width="1.4" stroke-dasharray="6 4"/>
<text class="zl" x="62" y="111" fill="#3b4655">Thời điểm biên dịch — desktop/build.rs</text>
<rect x="50" y="366" width="1100" height="250" rx="10" fill="#F3FAF5" stroke="#8FC8A3" stroke-width="1.4" stroke-dasharray="6 4"/>
<text class="zl" x="62" y="385" fill="#3b4655">Thời điểm chạy — desktop/src/lib.rs</text>
<rect x="74" y="140" width="240" height="66" rx="7" fill="#EFEFEF" stroke="#5B6675" stroke-width="1.6"/>
<text x="194.0" y="171.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1C2330">Nạp nhị phân vào binaries/</text>
<text x="194.0" y="186.0" text-anchor="middle" font-size="10" fill="#1C2330bb">age · age-keygen · exiftool</text>
<rect x="348" y="140" width="240" height="66" rx="7" fill="#F3E8FD" stroke="#7A3FBF" stroke-width="1.6"/>
<text x="468.0" y="177.75" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3A1560">Tính BLAKE3 của từng tệp</text>
<rect x="622" y="140" width="240" height="66" rx="7" fill="#E3F5E7" stroke="#1E7B34" stroke-width="1.6"/>
<text x="742.0" y="171.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0E3A19">Phát hằng số qua env!()</text>
<text x="742.0" y="186.0" text-anchor="middle" font-size="10" fill="#0E3A19bb">băm được nhúng vào mã máy</text>
<rect x="896" y="140" width="230" height="66" rx="7" fill="#E3F5E7" stroke="#1E7B34" stroke-width="1.6"/>
<text x="1011.0" y="165.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0E3A19">Kiểm kiến trúc tệp</text>
<text x="1011.0" y="179.75" text-anchor="middle" font-size="10" fill="#0E3A19bb">đọc header ELF / Mach-O / PE, KHÔNG</text>
<text x="1011.0" y="192.25" text-anchor="middle" font-size="10" fill="#0E3A19bb">thực thi</text>
<rect x="74" y="236" width="1052" height="80" rx="7" fill="#FFFDE7" stroke="#B8A429" stroke-width="1.6"/>
<text x="600.0" y="268.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4A4210">Chính sách bắt buộc và tùy chọn</text>
<text x="600.0" y="282.75" text-anchor="middle" font-size="10" fill="#4A4210bb">age và age-keygen là BẮT BUỘC: bản release thiếu chúng thì build hỏng ngay. exiftool là TÙY CHỌN: thiếu thì mô-đun Phân tích tự tắt theo hướng an toàn (mọi lệnh trả lỗi thay vì âm thầm bỏ</text>
<text x="600.0" y="295.25" text-anchor="middle" font-size="10" fill="#4A4210bb">qua).</text>
<rect x="74" y="414" width="300" height="76" rx="7" fill="#E6F4EA" stroke="#2E7D46" stroke-width="1.6"/>
<text x="224.0" y="444.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#12401F">resolve_binary</text>
<text x="224.0" y="458.75" text-anchor="middle" font-size="10" fill="#12401Fbb">bản release CHỈ tìm trong thư mục tài nguyên của gói</text>
<text x="224.0" y="471.25" text-anchor="middle" font-size="10" fill="#12401Fbb">hoặc cạnh tệp thực thi</text>
<rect x="410" y="414" width="300" height="76" rx="7" fill="#FCE4E4" stroke="#B3261E" stroke-width="1.6"/>
<text x="560.0" y="444.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5E1611">SV_AGE_BIN / SV_EXIFTOOL_BIN</text>
<text x="560.0" y="458.75" text-anchor="middle" font-size="10" fill="#5E1611bb">chỉ có hiệu lực trong bản debug — bề mặt phân giải</text>
<text x="560.0" y="471.25" text-anchor="middle" font-size="10" fill="#5E1611bb">bị đóng lại khi phát hành</text>
<rect x="746" y="414" width="380" height="76" rx="7" fill="#E3F5E7" stroke="#1E7B34" stroke-width="1.6"/>
<text x="936.0" y="450.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0E3A19">new_pinned: băm lại rồi so sánh</text>
<text x="936.0" y="465.0" text-anchor="middle" font-size="10" fill="#0E3A19bb">lệch băm ⇒ từ chối khởi tạo bộ điều hợp, không có đường vòng</text>
<rect x="74" y="512" width="1052" height="80" rx="7" fill="#FDE8E8" stroke="#C0392B" stroke-width="1.6"/>
<text x="600.0" y="544.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5E1611">Chạy có rào chắn</text>
<text x="600.0" y="558.75" text-anchor="middle" font-size="10" fill="#5E1611bb">env_clear() (Windows chỉ thêm lại SystemRoot, SystemDrive, TEMP, TMP cho trình nạp DLL và bộ sinh số ngẫu nhiên) · không qua shell · thư mục làm việc riêng cho ExifTool · ExifTool luôn nhận</text>
<text x="600.0" y="571.25" text-anchor="middle" font-size="10" fill="#5E1611bb">-config &quot;&quot; để tắt cơ chế cấu hình bằng mã Perl · hạn giờ tường 120 giây cho age và 60 giây cho ExifTool</text>
<rect x="50" y="646" width="1100" height="76" rx="7" fill="#FCE4E4" stroke="#B3261E" stroke-width="1.6"/>
<text x="600.0" y="676.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5E1611">Khoảng trống đã ghi nhận</text>
<text x="600.0" y="690.75" text-anchor="middle" font-size="10" fill="#5E1611bb">Kiểm tra băm diễn ra một lần khi khởi tạo bộ điều hợp; nếu tệp nhị phân bị thay thế giữa lần kiểm tra và lần thực thi (TOCTOU) thì hệ thống không phát hiện được. Ngoài ra gói phát hành hiện chưa được</text>
<text x="600.0" y="703.25" text-anchor="middle" font-size="10" fill="#5E1611bb">ký số và công chứng (H5), nên trên macOS một bản sao bị gắn nhãn cách ly có thể bị Gatekeeper chấm dứt — đây là điểm chặn phân phối đã được xác nhận bằng thực nghiệm.</text>
<text class="src" x="26" y="754">Nguồn: desktop/build.rs (emit_pin, detect_staged_target, check_staged_arch); desktop/src/lib.rs resolve_binary/build_backend/build_meta; crates/sv-age/src/lib.rs new_pinned</text>
</svg>