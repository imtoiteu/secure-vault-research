<rect x="583.535" y="371.0" width="52.93" height="16" rx="3" fill="#ffffffe0"/>
<text x="610.0" y="380.0" text-anchor="middle" font-size="9" fill="#3a5060">hiện thực</text>
<rect x="72" y="128" width="496" height="78" rx="7" fill="#FDE8E8" stroke="#C0392B" stroke-width="1.6"/>
<text x="320.0" y="158.75" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5E1611">«trait» Hasher</text>
<text x="320.0" y="172.25" text-anchor="middle" font-size="10" fill="#5E1611bb">alg() : HashAlg · hash(&amp;[u8]) : Hash32 · keyed_hash(&amp;[u8;32], &amp;[u8]) : Hash32 ·</text>
<text x="320.0" y="184.75" text-anchor="middle" font-size="10" fill="#5E1611bb">streaming() : Box&lt;dyn StreamingHasher&gt;</text>
<rect x="72" y="214" width="496" height="39" rx="7" fill="#FDE8E8" stroke="#C0392B" stroke-width="1.6"/>
<text x="320.0" y="231.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5E1611">«trait» KeyDerivation</text>
<text x="320.0" y="245.0" text-anchor="middle" font-size="10" fill="#5E1611bb">derive_key(context: &amp;str, ikm: &amp;[u8]) : Key32</text>
<rect x="72" y="261" width="496" height="52" rx="7" fill="#FDE8E8" stroke="#C0392B" stroke-width="1.6"/>
<text x="320.0" y="285.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5E1611">«trait» Kdf</text>
<text x="320.0" y="298.5" text-anchor="middle" font-size="10" fill="#5E1611bb">alg() : KdfAlg · derive(pass, salt, params) : Result&lt;Key32&gt;</text>
<rect x="72" y="321" width="496" height="65" rx="7" fill="#FDE8E8" stroke="#C0392B" stroke-width="1.6"/>
<text x="320.0" y="345.25" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5E1611">«trait» Signer</text>
<text x="320.0" y="358.75" text-anchor="middle" font-size="10" fill="#5E1611bb">generate() : (SecretBytes, Ed25519PublicKey) · sign(msg, sk, trusted_comment) :</text>
<text x="320.0" y="371.25" text-anchor="middle" font-size="10" fill="#5E1611bb">MinisignSignature · verify(msg, sig, pk) : Result&lt;()&gt;</text>
<rect x="72" y="394" width="496" height="52" rx="7" fill="#FDE8E8" stroke="#C0392B" stroke-width="1.6"/>
<text x="320.0" y="418.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5E1611">«trait» SecretSharer</text>
<text x="320.0" y="431.5" text-anchor="middle" font-size="10" fill="#5E1611bb">split(&amp;Key32, n, k) : Vec&lt;KeyShare&gt; · combine(&amp;[KeyShare]) : Key32</text>
<rect x="72" y="454" width="496" height="65" rx="7" fill="#FDE8E8" stroke="#C0392B" stroke-width="1.6"/>
<text x="320.0" y="484.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5E1611">«trait» FileCipher</text>
<text x="320.0" y="498.0" text-anchor="middle" font-size="10" fill="#5E1611bb">alg() : FileCipherAlg · encrypt(pt, ct, recipient) · decrypt(ct, pt, identity)</text>
<rect x="662" y="128" width="476" height="46" rx="7" fill="#F3E8FD" stroke="#7A3FBF" stroke-width="1.6"/>
<text x="900.0" y="149.25" text-anchor="middle" font-size="12" font-weight="700" fill="#3A1560">Blake3Hasher</text>
<text x="900.0" y="163.25" text-anchor="middle" font-size="10" fill="#3A1560bb">Hasher + KeyDerivation → crate blake3</text>
<rect x="662" y="180" width="476" height="46" rx="7" fill="#F3E8FD" stroke="#7A3FBF" stroke-width="1.6"/>
<text x="900.0" y="201.25" text-anchor="middle" font-size="12" font-weight="700" fill="#3A1560">Argon2Kdf</text>
<text x="900.0" y="215.25" text-anchor="middle" font-size="10" fill="#3A1560bb">Kdf → crate argon2 (Argon2id, V0x13)</text>
<rect x="662" y="232" width="476" height="46" rx="7" fill="#F3E8FD" stroke="#7A3FBF" stroke-width="1.6"/>
<text x="900.0" y="253.25" text-anchor="middle" font-size="12" font-weight="700" fill="#3A1560">SodiumMinisignSigner</text>
<text x="900.0" y="267.25" text-anchor="middle" font-size="10" fill="#3A1560bb">Signer → libsodium Ed25519 + BLAKE2b</text>
<rect x="662" y="284" width="476" height="46" rx="7" fill="#F3E8FD" stroke="#7A3FBF" stroke-width="1.6"/>
<text x="900.0" y="305.25" text-anchor="middle" font-size="12" font-weight="700" fill="#3A1560">SssSharer</text>
<text x="900.0" y="319.25" text-anchor="middle" font-size="10" fill="#3A1560bb">SecretSharer → sss hazmat.c</text>
<rect x="662" y="336" width="476" height="46" rx="7" fill="#F3E8FD" stroke="#7A3FBF" stroke-width="1.6"/>
<text x="900.0" y="357.25" text-anchor="middle" font-size="12" font-weight="700" fill="#3A1560">AgeCipher</text>
<text x="900.0" y="371.25" text-anchor="middle" font-size="10" fill="#3A1560bb">FileCipher → tiến trình con age đã ghim băm</text>
<rect x="662" y="448" width="476" height="56" rx="7" fill="#FFF0F6" stroke="#B5197F" stroke-width="1.6"/>
<text x="900.0" y="474.25" text-anchor="middle" font-size="12" font-weight="700" fill="#5A0C3E">Key32</text>
<text x="900.0" y="488.25" text-anchor="middle" font-size="10" fill="#5A0C3Ebb">[u8; 32] trên ngăn xếp · Zeroize + ZeroizeOnDrop · không cấp phát động</text>
<rect x="662" y="510" width="476" height="56" rx="7" fill="#FFF0F6" stroke="#B5197F" stroke-width="1.6"/>
<text x="900.0" y="536.25" text-anchor="middle" font-size="12" font-weight="700" fill="#5A0C3E">KeyShare</text>
<text x="900.0" y="550.25" text-anchor="middle" font-size="10" fill="#5A0C3Ebb">[u8; 33] · một mảnh Shamir đã xác thực</text>
<rect x="662" y="572" width="476" height="56" rx="7" fill="#FFF0F6" stroke="#B5197F" stroke-width="1.6"/>
<text x="900.0" y="598.25" text-anchor="middle" font-size="12" font-weight="700" fill="#5A0C3E">SecretBytes</text>
<text x="900.0" y="612.25" text-anchor="middle" font-size="10" fill="#5A0C3Ebb">Box&lt;[u8]&gt; — không có dung lượng dư nên không thể tái cấp phát rồi rò rỉ</text>
<rect x="662" y="634" width="476" height="56" rx="7" fill="#FFF0F6" stroke="#B5197F" stroke-width="1.6"/>
<text x="900.0" y="660.25" text-anchor="middle" font-size="12" font-weight="700" fill="#5A0C3E">AgeIdentity</text>
<text x="900.0" y="674.25" text-anchor="middle" font-size="10" fill="#5A0C3Ebb">bọc SecretBytes cho khóa bí mật age</text>
<rect x="50" y="530" width="540" height="130" rx="7" fill="#FFFFFF" stroke="#5B6675" stroke-width="1.6"/>
<text x="320.0" y="587.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1C2330">Kiểu giá trị KHÔNG bí mật (được Serialize, nằm trong header)</text>
<text x="320.0" y="601.0" text-anchor="middle" font-size="10" fill="#1C2330bb">Hash32 · Salt · Argon2idParams · KdfParams · MinisignSignature · Ed25519PublicKey · AgeRecipient</text>
<text x="320.0" y="613.5" text-anchor="middle" font-size="10" fill="#1C2330bb">· KdfAlg · HashAlg · AeadAlg · FileCipherAlg · SigAlg</text>
<rect x="50" y="680" width="540" height="90" rx="7" fill="#FCE4E4" stroke="#B3261E" stroke-width="1.6"/>
<text x="320.0" y="717.0" text-anchor="middle" font-size="12" font-weight="700" fill="#5E1611">CryptoError</text>
<text x="320.0" y="731.0" text-anchor="middle" font-size="10" fill="#5E1611bb">InvalidParameter · VerificationFailed · Backend · Timeout · NotImplemented; được tầng nghiệp vụ</text>
<text x="320.0" y="743.5" text-anchor="middle" font-size="10" fill="#5E1611bb">ánh xạ tiếp sang VaultError rồi ApiError</text>
<text x="50" y="800" text-anchor="start" font-size="11" font-weight="400" fill="#3a4a5a">Ba kiểu bí mật cố tình không cài Serialize: đó là rào chắn ở mức trình biên dịch khiến một lập trình viên không thể vô ý đưa khóa vào DTO đi qua biên IPC.</text>
<text class="src" x="26" y="804">Nguồn: crates/sv-crypto-traits/src/lib.rs; crates/sv-crypto/src/lib.rs</text>
</svg>