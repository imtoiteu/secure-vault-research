<text class="ttl" x="26" y="34">Hình 3.2 — Sơ đồ lớp của tầng ABI mật mã và các bộ điều hợp hiện thực</text>
<text class="sub" x="26" y="54">Cổng là trait, bộ điều hợp là struct kích thước không, kiểu bí mật tự xóa khi hủy</text>
<rect x="50" y="90" width="540" height="420" rx="10" fill="#FFF6F5" stroke="#E0A29B" stroke-width="1.4" stroke-dasharray="6 4"/>
<text class="zl" x="62" y="109" fill="#3b4655">«interface» — cổng trong sv-crypto-traits</text>
<rect x="640" y="90" width="520" height="300" rx="10" fill="#FAF5FF" stroke="#BFA0E0" stroke-width="1.4" stroke-dasharray="6 4"/>
<text class="zl" x="652" y="109" fill="#3b4655">Bộ điều hợp cụ thể trong sv-crypto / sv-age</text>
<rect x="640" y="410" width="520" height="300" rx="10" fill="#F7F7F8" stroke="#B9C0C9" stroke-width="1.4" stroke-dasharray="6 4"/>
<text class="zl" x="652" y="429" fill="#3b4655">Kiểu giá trị bí mật (không Serialize, Debug bị che)</text>
