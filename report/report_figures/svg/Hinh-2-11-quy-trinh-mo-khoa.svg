<text x="530.0" y="203.75" text-anchor="middle" font-size="12.5" font-weight="700" fill="#12401F">read_file: stat rồi mới đọc, chặn tệp &gt; 2 GiB</text>
<polygon points="530.0,248 730,279.0 530.0,310 330,279.0" fill="#FFF4E5" stroke="#C77700" stroke-width="1.6"/>
<text x="530.0" y="283.0" text-anchor="middle" font-size="11" font-weight="700" fill="#5A3600">Đúng MAGIC &quot;SVLT&quot; và FORMAT_VERSION = 1?</text>
<polygon points="530.0,336 730,367.0 530.0,398 330,367.0" fill="#FFF4E5" stroke="#C77700" stroke-width="1.6"/>
<text x="530.0" y="371.0" text-anchor="middle" font-size="11" font-weight="700" fill="#5A3600">Chữ ký minisign trên gốc ràng buộc hợp lệ?</text>
<rect x="330" y="424" width="400" height="60" rx="7" fill="#E3F5E7" stroke="#1E7B34" stroke-width="1.6"/>
<text x="530.0" y="451.75" text-anchor="middle" font-size="11" font-weight="700" fill="#0E3A19">validate_kdf: chặn tham số Argon2 vượt trần trước khi chạy</text>
<text x="530.0" y="464.75" text-anchor="middle" font-size="10" fill="#0E3A19bb">mem ≤ 4 GiB, t ≤ 64, p ≤ 64</text>
<rect x="330" y="500" width="400" height="54" rx="7" fill="#F3E8FD" stroke="#7A3FBF" stroke-width="1.6"/>
<text x="530.0" y="531.75" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3A1560">Argon2id(mật khẩu, muối, tham số) → MK</text>
<rect x="330" y="570" width="400" height="54" rx="7" fill="#F3E8FD" stroke="#7A3FBF" stroke-width="1.6"/>
<text x="530.0" y="601.75" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3A1560">derive_wrap_key(MK, age-identity, uuid)</text>
<polygon points="530.0,640 730,671.0 530.0,702 330,671.0" fill="#FFF4E5" stroke="#C77700" stroke-width="1.6"/>
<text x="530.0" y="675.0" text-anchor="middle" font-size="11" font-weight="700" fill="#5A3600">secretbox::open(danh tính age) thành công?</text>
<rect x="330" y="728" width="400" height="60" rx="7" fill="#E6F4EA" stroke="#2E7D46" stroke-width="1.6"/>
<text x="530.0" y="749.5" text-anchor="middle" font-size="11" font-weight="700" fill="#12401F">Tạo phiên: session_id ngẫu nhiên 32 byte ↦ (MK, đường dẫn)</text>
<text x="530.0" y="762.5" text-anchor="middle" font-size="10" fill="#12401Fbb">chỉ khóa chủ được giữ; danh tính và khóa ký sinh lại theo từng thao</text>
<text x="530.0" y="775.0" text-anchor="middle" font-size="10" fill="#12401Fbb">tác</text>
<rect x="810" y="250" width="260" height="58" rx="7" fill="#FCE4E4" stroke="#B3261E" stroke-width="1.6"/>
<text x="940.0" y="277.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5E1611">SV-MALFORMED</text>
<text x="940.0" y="292.0" text-anchor="middle" font-size="10" fill="#5E1611bb">không phải tệp két</text>
<rect x="810" y="320" width="260" height="58" rx="7" fill="#FCE4E4" stroke="#B3261E" stroke-width="1.6"/>
<text x="940.0" y="347.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5E1611">SV-INCOMPATIBLE-VERSION</text>
<text x="940.0" y="362.0" text-anchor="middle" font-size="10" fill="#5E1611bb">phiên bản định dạng lạ</text>
<rect x="810" y="396" width="260" height="58" rx="7" fill="#FCE4E4" stroke="#B3261E" stroke-width="1.6"/>
<text x="940.0" y="423.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5E1611">SV-CORRUPTED</text>
<text x="940.0" y="438.0" text-anchor="middle" font-size="10" fill="#5E1611bb">tệp hỏng hoặc bị sửa đổi</text>
<rect x="810" y="650" width="260" height="58" rx="7" fill="#FCE4E4" stroke="#B3261E" stroke-width="1.6"/>
<text x="940.0" y="671.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5E1611">SV-UNAUTHORIZED</text>
<text x="940.0" y="685.75" text-anchor="middle" font-size="10" fill="#5E1611bb">sai mật khẩu HOẶC sai mảnh khôi phục — hợp</text>
<text x="940.0" y="698.25" text-anchor="middle" font-size="10" fill="#5E1611bb">nhất một mã</text>
<rect x="40" y="336" width="250" height="300" rx="7" fill="#FFFDE7" stroke="#B8A429" stroke-width="1.6"/>
<text x="165.0" y="453.0" text-anchor="middle" font-size="12" font-weight="700" fill="#4A4210">Vì sao thứ tự này quan trọng?</text>
<text x="165.0" y="467.0" text-anchor="middle" font-size="10" fill="#4A4210bb">Cổng chữ ký nằm TRƯỚC cổng mật khẩu và</text>
<text x="165.0" y="479.5" text-anchor="middle" font-size="10" fill="#4A4210bb">không dùng đến bất kỳ thông tin bí mật nào.</text>
<text x="165.0" y="492.0" text-anchor="middle" font-size="10" fill="#4A4210bb">Nhờ vậy kết quả &quot;tệp bị sửa&quot; không thể bị</text>
<text x="165.0" y="504.5" text-anchor="middle" font-size="10" fill="#4A4210bb">dùng làm tín hiệu phân biệt mật khẩu</text>
<text x="165.0" y="517.0" text-anchor="middle" font-size="10" fill="#4A4210bb">đúng/sai. Ngược lại, mọi thất bại ở cổng</text>
<text x="165.0" y="529.5" text-anchor="middle" font-size="10" fill="#4A4210bb">mật khẩu đều trả về đúng một mã duy nhất.</text>
<text x="40" y="830" text-anchor="start" font-size="11" font-weight="400" fill="#3a4a5a">Đường khôi phục bằng mảnh (recover) đi theo đúng khung này, chỉ khác ở chỗ MK được tái tạo bằng SssSharer::combine thay vì Argon2id; cổng tín nhiệm cuối cùng vẫn là phép mở bọc danh</text>
<text x="40" y="844" text-anchor="start" font-size="11" font-weight="400" fill="#3a4a5a">tính age, nên hai đường thất bại theo cùng một cách.</text>
