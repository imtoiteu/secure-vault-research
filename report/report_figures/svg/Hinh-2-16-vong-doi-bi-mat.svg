<text x="230.0" y="158.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5A0C3E">IpcPassphrase</text>
<text x="230.0" y="172.75" text-anchor="middle" font-size="10" fill="#5A0C3Ebb">tự xóa khi hủy; Debug bị che; chuyển sang</text>
<text x="230.0" y="185.25" text-anchor="middle" font-size="10" fill="#5A0C3Ebb">SecretBytes ngay dòng đầu của handler</text>
<rect x="410" y="130" width="320" height="72" rx="7" fill="#FCE4E4" stroke="#B3261E" stroke-width="1.6"/>
<text x="570.0" y="164.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5E1611">Bản sao thượng nguồn của Tauri/serde</text>
<text x="570.0" y="179.0" text-anchor="middle" font-size="10" fill="#5E1611bb">RỦI RO TỒN ĐỌNG N1 — nằm ngoài tầm với của ứng dụng</text>
<rect x="760" y="130" width="390" height="72" rx="7" fill="#E3F5E7" stroke="#1E7B34" stroke-width="1.6"/>
<text x="955.0" y="164.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0E3A19">getrandom (CSPRNG hệ điều hành)</text>
<text x="955.0" y="179.0" text-anchor="middle" font-size="10" fill="#0E3A19bb">uuid · muối · nonce · session_id · DEK · group_id</text>
<rect x="80" y="266" width="300" height="72" rx="7" fill="#FFF0F6" stroke="#B5197F" stroke-width="1.6"/>
<text x="230.0" y="300.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5A0C3E">Key32 — khóa chủ</text>
<text x="230.0" y="315.0" text-anchor="middle" font-size="10" fill="#5A0C3Ebb">ZeroizeOnDrop, không Serialize</text>
<rect x="410" y="266" width="320" height="72" rx="7" fill="#FFF0F6" stroke="#B5197F" stroke-width="1.6"/>
<text x="570.0" y="300.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5A0C3E">Key32 — khóa bọc theo trường</text>
<text x="570.0" y="315.0" text-anchor="middle" font-size="10" fill="#5A0C3Ebb">sinh lại mỗi thao tác, không lưu ở đâu</text>
<rect x="760" y="266" width="390" height="72" rx="7" fill="#FFF0F6" stroke="#B5197F" stroke-width="1.6"/>
<text x="955.0" y="300.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5A0C3E">SecretBytes / KeyShare</text>
<text x="955.0" y="315.0" text-anchor="middle" font-size="10" fill="#5A0C3Ebb">Box&lt;[u8]&gt; không dư dung lượng nên không thể tái cấp phát rồi rò rỉ</text>
<rect x="80" y="402" width="300" height="72" rx="7" fill="#E6F4EA" stroke="#2E7D46" stroke-width="1.6"/>
<text x="230.0" y="436.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#12401F">SessionState { master_key, vault_path }</text>
<text x="230.0" y="451.0" text-anchor="middle" font-size="10" fill="#12401Fbb">tra cứu theo session_id mờ; UI chỉ giữ chuỗi handle</text>
<rect x="410" y="402" width="320" height="72" rx="7" fill="#F3E8FD" stroke="#7A3FBF" stroke-width="1.6"/>
<text x="570.0" y="436.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3A1560">Danh tính age tạm thời</text>
<text x="570.0" y="451.0" text-anchor="middle" font-size="10" fill="#3A1560bb">ghi ra tệp tạm 0600 chỉ trong một lệnh age -d</text>
<rect x="760" y="402" width="390" height="72" rx="7" fill="#FFF4E5" stroke="#C77700" stroke-width="1.6"/>
<text x="955.0" y="436.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5A3600">UnpackedArchive.item_bytes</text>
<text x="955.0" y="451.0" text-anchor="middle" font-size="10" fill="#5A3600bb">vùng dữ liệu rõ của các mục</text>
<rect x="80" y="538" width="300" height="72" rx="7" fill="#E3F5E7" stroke="#1E7B34" stroke-width="1.6"/>
<text x="230.0" y="572.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0E3A19">vault_lock</text>
<text x="230.0" y="587.0" text-anchor="middle" font-size="10" fill="#0E3A19bb">xóa khỏi bảng phiên ⇒ Key32 bị ghi 0</text>
<rect x="410" y="538" width="320" height="72" rx="7" fill="#E3F5E7" stroke="#1E7B34" stroke-width="1.6"/>
<text x="570.0" y="572.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0E3A19">Drop của SecureIdentityFile</text>
<text x="570.0" y="587.0" text-anchor="middle" font-size="10" fill="#0E3A19bb">ghi đè bằng 0 rồi unlink (nỗ lực tối đa)</text>
<rect x="760" y="538" width="390" height="72" rx="7" fill="#E3F5E7" stroke="#1E7B34" stroke-width="1.6"/>
<text x="955.0" y="572.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0E3A19">Drop của UnpackedArchive</text>
<text x="955.0" y="587.0" text-anchor="middle" font-size="10" fill="#0E3A19bb">zeroize vùng byte nội dung; pack_archive cũng xóa vùng nháp</text>
<text x="50" y="652" text-anchor="start" font-size="11" font-weight="400" fill="#3a4a5a">Giới hạn được thừa nhận: dự án KHÔNG khóa trang bộ nhớ (mlock/VirtualLock) vì việc đó đòi hỏi mã unsafe theo nền tảng, trái với tư thế #![forbid(unsafe_code)] của các crate nghiệp vụ. Biện pháp thay</text>
<text x="50" y="666" text-anchor="start" font-size="11" font-weight="400" fill="#3a4a5a">thế được khuyến nghị là mã hóa toàn đĩa và mã hóa vùng swap ở mức hệ điều hành. Một kẻ tấn công đọc được bộ nhớ tiến trình nằm NGOÀI mô hình đe dọa.</text>
<text class="src" x="26" y="754">Nguon: crates/sv-crypto-traits/src/lib.rs (Key32/SecretBytes/KeyShare); src-tauri/src/{passphrase,service}.rs; crates/sv-core/src/container.rs (UnpackedArchive::drop)</text>
