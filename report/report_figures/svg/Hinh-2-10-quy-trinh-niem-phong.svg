<text x="660.0" y="477.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5A0C3E">Gốc ràng buộc</text>
<text x="660.0" y="491.75" text-anchor="middle" font-size="10" fill="#5A0C3Ebb">BLAKE3(header_digest ‖</text>
<text x="660.0" y="504.25" text-anchor="middle" font-size="10" fill="#5A0C3Ebb">payload_digest)</text>
<rect x="550" y="552" width="220" height="66" rx="7" fill="#F3E8FD" stroke="#7A3FBF" stroke-width="1.6"/>
