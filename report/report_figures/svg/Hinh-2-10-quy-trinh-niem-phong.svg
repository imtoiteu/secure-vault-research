<text x="410.0" y="140.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5A3600">pack_archive</text>
<text x="410.0" y="154.75" text-anchor="middle" font-size="10" fill="#5A3600bb">DIR_LEN ‖ CBOR(ItemDirectory) ‖ byte</text>
<text x="410.0" y="167.25" text-anchor="middle" font-size="10" fill="#5A3600bb">nội dung</text>
<rect x="550" y="110" width="220" height="76" rx="7" fill="#FFF0F6" stroke="#B5197F" stroke-width="1.6"/>
<text x="660.0" y="140.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5A0C3E">Kho lưu trữ dạng rõ</text>
<text x="660.0" y="154.75" text-anchor="middle" font-size="10" fill="#5A0C3Ebb">danh mục tệp nằm BÊN TRONG vùng sẽ</text>
<text x="660.0" y="167.25" text-anchor="middle" font-size="10" fill="#5A0C3Ebb">được mã hóa</text>
<rect x="800" y="110" width="220" height="76" rx="7" fill="#F3E8FD" stroke="#7A3FBF" stroke-width="1.6"/>
<text x="910.0" y="146.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3A1560">age -e -r &lt;recipient&gt;</text>
<text x="910.0" y="161.0" text-anchor="middle" font-size="10" fill="#3A1560bb">X25519 + ChaCha20-Poly1305</text>
<rect x="800" y="240" width="220" height="70" rx="7" fill="#EAF6F6" stroke="#0F7B7B" stroke-width="1.6"/>
<text x="910.0" y="273.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0A3D3D">PAYLOAD</text>
<text x="910.0" y="288.0" text-anchor="middle" font-size="10" fill="#0A3D3Dbb">một khối mã age duy nhất</text>
<rect x="550" y="240" width="220" height="70" rx="7" fill="#EAF6F6" stroke="#0F7B7B" stroke-width="1.6"/>
<text x="660.0" y="267.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0A3D3D">HEADER (CBOR)</text>
<text x="660.0" y="281.75" text-anchor="middle" font-size="10" fill="#0A3D3Dbb">suite · uuid · kdf · khóa đã bọc ·</text>
<text x="660.0" y="294.25" text-anchor="middle" font-size="10" fill="#0A3D3Dbb">khóa công khai</text>
<rect x="300" y="240" width="220" height="70" rx="7" fill="#EAF6F6" stroke="#0F7B7B" stroke-width="1.6"/>
<text x="410.0" y="273.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0A3D3D">Tiền tố</text>
<text x="410.0" y="288.0" text-anchor="middle" font-size="10" fill="#0A3D3Dbb">MAGIC ‖ VERSION ‖ HEADER_LEN</text>
