<text x="160.0" y="146.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5A3600">Danh sách mục dạng rõ</text>
<text x="160.0" y="161.0" text-anchor="middle" font-size="10" fill="#5A3600bb">mục đã có + mục mới thêm</text>
