<text x="160.0" y="527.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0A3D3D">Tệp .svault</text>
<text x="160.0" y="541.75" text-anchor="middle" font-size="10" fill="#0A3D3Dbb">MAGIC ‖ VERSION ‖ HEADER_LEN ‖ HEADER</text>
<text x="160.0" y="554.25" text-anchor="middle" font-size="10" fill="#0A3D3Dbb">‖ PAYLOAD ‖ SIG_TRAILER</text>
<rect x="800" y="552" width="220" height="66" rx="7" fill="#E3F5E7" stroke="#1E7B34" stroke-width="1.6"/>
<text x="910.0" y="583.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0E3A19">write_atomic</text>
<text x="910.0" y="598.0" text-anchor="middle" font-size="10" fill="#0E3A19bb">temp cùng thư mục → fsync → rename</text>
<text x="50" y="662" text-anchor="start" font-size="11" font-weight="400" fill="#3a4a5a">Hai bản tóm lược thành phần được TÍNH LẠI mỗi lần đọc chứ không lưu trong tệp, nên không thể ghép header của tệp này với payload của tệp khác. Do danh mục tệp nằm trong vùng đã mã hóa, một két đang khóa</text>
<text x="50" y="676" text-anchor="start" font-size="11" font-weight="400" fill="#3a4a5a">không để lộ tên, kích thước hay số lượng mục — chỉ lộ tổng độ dài bản mã.</text>
<text class="src" x="26" y="744">Nguon: src-tauri/src/service.rs write_vault; crates/sv-core/src/container.rs pack_archive/encode/binding_root/write_atomic</text>
