<text x="216.0" y="554.75" text-anchor="middle" font-size="10" fill="#0A3D3Dbb">MAGIC SVLT · header CBOR đã ký · tải</text>
<text x="216.0" y="567.25" text-anchor="middle" font-size="10" fill="#0A3D3Dbb">trọng age</text>
<path d="M344 514 A110.0 14 0 0 1 564 514 L564 582 A110.0 14 0 0 1 344 582 Z" fill="#EAF6F6" stroke="#0F7B7B" stroke-width="1.6"/><path d="M344 514 A110.0 14 0 0 0 564 514" fill="none" stroke="#0F7B7B" stroke-width="1.6"/>
<text x="454.0" y="546.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0A3D3D">.svenc / .svkey</text>
<text x="454.0" y="561.0" text-anchor="middle" font-size="10" fill="#0A3D3Dbb">Argon2id + secretbox</text>
<path d="M582 514 A110.0 14 0 0 1 802 514 L802 582 A110.0 14 0 0 1 582 582 Z" fill="#EAF6F6" stroke="#0F7B7B" stroke-width="1.6"/><path d="M582 514 A110.0 14 0 0 0 802 514" fill="none" stroke="#0F7B7B" stroke-width="1.6"/>
<text x="692.0" y="546.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0A3D3D">.svss (mảnh + tải trọng)</text>
<text x="692.0" y="561.0" text-anchor="middle" font-size="10" fill="#0A3D3Dbb">SVSSS 92 byte · SVSSP</text>
<path d="M820 514 A117.0 14 0 0 1 1054 514 L1054 582 A117.0 14 0 0 1 820 582 Z" fill="#EAF6F6" stroke="#0F7B7B" stroke-width="1.6"/><path d="M820 514 A117.0 14 0 0 0 1054 514" fill="none" stroke="#0F7B7B" stroke-width="1.6"/>
<text x="937.0" y="546.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0A3D3D">ảnh PNG / BMP / JPEG</text>
<text x="937.0" y="561.0" text-anchor="middle" font-size="10" fill="#0A3D3Dbb">mang dữ liệu ẩn hoặc thủy vân</text>
<text x="50" y="672" text-anchor="start" font-size="11" font-weight="400" fill="#3a4a5a">Bản dựng release chỉ phân giải nhị phân từ thư mục tài nguyên của gói hoặc thư mục cạnh tệp thực thi; các biến môi trường SV_AGE_BIN / SV_AGE_KEYGEN_BIN / SV_EXIFTOOL_BIN chỉ có hiệu lực</text>
<text x="50" y="686" text-anchor="start" font-size="11" font-weight="400" fill="#3a4a5a">trong bản debug. Gói phát hành hiện chưa được ký số và công chứng — đây là hạn chế đã ghi nhận (H5) và nằm ngoài phạm vi sử dụng nội bộ.</text>
<text class="src" x="26" y="804">Nguon: desktop/tauri.conf.json (bundle.resources), desktop/src/lib.rs run()/resolve_binary, docs/DEPLOYMENT.md</text>
