<text x="241.0" y="210.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#12305F">Luồng WebView</text>
<text x="241.0" y="224.75" text-anchor="middle" font-size="10" fill="#12305Fbb">WebView2 / WKWebView / WebKitGTK · CSP</text>
<text x="241.0" y="237.25" text-anchor="middle" font-size="10" fill="#12305Fbb">default-src &#x27;self&#x27;</text>
<rect x="400" y="176" width="274" height="84" rx="7" fill="#E6F4EA" stroke="#2E7D46" stroke-width="1.6"/>
<text x="537.0" y="216.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#12401F">Luồng lõi Rust</text>
<text x="537.0" y="231.0" text-anchor="middle" font-size="10" fill="#12401Fbb">bộ điều phối lệnh Tauri (thread pool)</text>
<rect x="106" y="292" width="568" height="110" rx="7" fill="#E6F4EA" stroke="#2E7D46" stroke-width="1.6"/>
<text x="390.0" y="339.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#12401F">Năm trạng thái quản lý được đăng ký lúc khởi động</text>
<text x="390.0" y="353.75" text-anchor="middle" font-size="10" fill="#12401Fbb">Backend = AppVault&lt;AgePayloadCipher&gt; · Platform · Stego · Meta (bật/tắt an toàn) · Watermark; bảng</text>
<text x="390.0" y="366.25" text-anchor="middle" font-size="10" fill="#12401Fbb">phiên giữ duy nhất khóa chủ theo SessionHandle</text>
<rect x="766" y="176" width="288" height="60" rx="7" fill="#FDE8E8" stroke="#C0392B" stroke-width="1.6"/>
<text x="910.0" y="204.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5E1611">age · age-keygen</text>
<text x="910.0" y="219.0" text-anchor="middle" font-size="10" fill="#5E1611bb">bắt buộc — thiếu thì bản release lỗi build</text>
<rect x="766" y="250" width="288" height="60" rx="7" fill="#FDE8E8" stroke="#C0392B" stroke-width="1.6"/>
<text x="910.0" y="278.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5E1611">exiftool</text>
<text x="910.0" y="293.0" text-anchor="middle" font-size="10" fill="#5E1611bb">tùy chọn — thiếu thì tắt mô-đun an toàn</text>
<rect x="766" y="324" width="288" height="78" rx="7" fill="#E3F5E7" stroke="#1E7B34" stroke-width="1.6"/>
<text x="910.0" y="355.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0E3A19">Băm BLAKE3 được ghim lúc biên dịch</text>
<text x="910.0" y="369.75" text-anchor="middle" font-size="10" fill="#0E3A19bb">kiểm tra lại khi khởi tạo bộ điều hợp; sai băm là</text>
<text x="910.0" y="382.25" text-anchor="middle" font-size="10" fill="#0E3A19bb">từ chối chạy</text>
<path d="M106 514 A110.0 14 0 0 1 326 514 L326 582 A110.0 14 0 0 1 106 582 Z" fill="#EAF6F6" stroke="#0F7B7B" stroke-width="1.6"/><path d="M106 514 A110.0 14 0 0 0 326 514" fill="none" stroke="#0F7B7B" stroke-width="1.6"/>
