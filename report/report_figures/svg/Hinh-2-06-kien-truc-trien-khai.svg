<text class="ttl" x="26" y="34">Hình 2.6 — Kiến trúc triển khai và thực thi trên máy người dùng</text>
<text class="sub" x="26" y="54">Một tiến trình, một webview, hai họ tiến trình con, không có tiến trình nền hay cổng mạng</text>
<rect x="50" y="80" width="1060" height="560" rx="10" fill="#F7F7F8" stroke="#B9C0C9" stroke-width="1.4" stroke-dasharray="6 4"/>
<text class="zl" x="62" y="99" fill="#3b4655">Máy của người dùng (Windows / macOS / Linux)</text>
<text class="zs" x="62" y="114">Không yêu cầu quyền quản trị; không có dịch vụ nền</text>
<rect x="80" y="128" width="620" height="300" rx="10" fill="#F3FAF5" stroke="#8FC8A3" stroke-width="1.4" stroke-dasharray="6 4"/>
<text class="zl" x="92" y="147" fill="#3b4655">Tiến trình ứng dụng Secure Vault</text>
