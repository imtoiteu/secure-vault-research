<text x="1185.0" y="521.5" text-anchor="middle" font-size="8" font-weight="700" fill="#5A3600"></text>
<text x="137.0" y="155.5" text-anchor="start" font-size="10.4" font-weight="400" fill="#2f3d4c">invoke(&quot;item_add&quot;, { session,</text>
<text x="137.0" y="168.9" text-anchor="start" font-size="10.4" font-weight="400" fill="#2f3d4c">source, name })</text>
<text x="337.0" y="211.0" text-anchor="start" font-size="10.4" font-weight="400" fill="#2f3d4c">add_item(&amp;session, source, name)</text>
<text x="543.0" y="248.0" text-anchor="start" font-size="10.4" font-weight="400" fill="#2f3d4c">1. Kiểm tra tên khác rỗng; stat(source): nếu &gt; 2 GiB trả SV-TOO-LARGE trước khi đọc bất kỳ byte nào</text>
<text x="543.0" y="302.0" text-anchor="start" font-size="10.4" font-weight="400" fill="#2f3d4c">2. Lấy khóa ghi theo đường dẫn két đã chuẩn hóa — giữ suốt chu trình đọc-sửa-ghi để hai lệnh đồng thời không mất cập nhật</text>
<text x="537.0" y="349.0" text-anchor="start" font-size="10.4" font-weight="400" fill="#2f3d4c">3. decode(bytes): xác minh chữ ký trên gốc ràng buộc TRƯỚC mọi thao tác khóa</text>
<text x="537.0" y="379.0" text-anchor="start" font-size="10.4" font-weight="400" fill="#2f3d4c">OpenedContainer { header, payload }</text>
<text x="537.0" y="396.5" text-anchor="start" font-size="10.4" font-weight="400" fill="#2f3d4c">4. derive_wrap_key(MK,</text>
<text x="537.0" y="409.9" text-anchor="start" font-size="10.4" font-weight="400" fill="#2f3d4c">WrapField::AgeIdentity, vault_uuid)</text>
<text x="537.0" y="452.0" text-anchor="start" font-size="10.4" font-weight="400" fill="#2f3d4c">Key32 — tự xóa khi hủy</text>
<text x="543.0" y="489.0" text-anchor="start" font-size="10.4" font-weight="400" fill="#2f3d4c">5. secretbox::open(khóa bọc, wrapped_age_identity); thất bại ⇒ SV-UNAUTHORIZED</text>
<text x="537.0" y="523.0" text-anchor="start" font-size="10.4" font-weight="400" fill="#2f3d4c">6. decrypt(payload, identity) → age -d với danh tính trong tệp tạm 0600</text>
<text x="537.0" y="553.0" text-anchor="start" font-size="10.4" font-weight="400" fill="#2f3d4c">Kho lưu trữ dạng rõ (bị xóa sạch ngay sau khi dùng)</text>
<text x="537.0" y="583.0" text-anchor="start" font-size="10.4" font-weight="400" fill="#2f3d4c">7. unpack_archive → ItemDirectory + vùng byte nội dung</text>
<text x="543.0" y="620.0" text-anchor="start" font-size="10.4" font-weight="400" fill="#2f3d4c">8. Đọc tệp nguồn, sinh item_id 16 byte ngẫu nhiên, tính BLAKE3 nội dung</text>
<text x="537.0" y="654.0" text-anchor="start" font-size="10.4" font-weight="400" fill="#2f3d4c">9. pack_archive(toàn bộ mục cũ + mục mới) → kho lưu trữ mới</text>
<text x="537.0" y="684.0" text-anchor="start" font-size="10.4" font-weight="400" fill="#2f3d4c">10. encrypt(archive, age_recipient) → PAYLOAD mới</text>
<text x="537.0" y="701.5" text-anchor="start" font-size="10.4" font-weight="400" fill="#2f3d4c">11. Mở bọc khóa ký; encode() tính lại</text>
<text x="537.0" y="714.9" text-anchor="start" font-size="10.4" font-weight="400" fill="#2f3d4c">gốc ràng buộc và ký lại</text>
<text x="537.0" y="757.0" text-anchor="start" font-size="10.4" font-weight="400" fill="#2f3d4c">12. write_atomic: tệp tạm cùng thư mục → fsync → rename</text>
<text x="337.0" y="762.0" text-anchor="start" font-size="10.4" font-weight="400" fill="#2f3d4c">ItemInfo { item_id, name,</text>
<text x="337.0" y="775.4" text-anchor="start" font-size="10.4" font-weight="400" fill="#2f3d4c">size_bytes, content_hash_hex } —</text>
<text x="337.0" y="788.8" text-anchor="start" font-size="10.4" font-weight="400" fill="#2f3d4c">không chứa bí mật</text>
<text x="137.0" y="830.5" text-anchor="start" font-size="10.4" font-weight="400" fill="#2f3d4c">Kết quả, hoặc ApiError mang mã</text>
<text x="137.0" y="843.9" text-anchor="start" font-size="10.4" font-weight="400" fill="#2f3d4c">SV-* đã bản địa hóa</text>
<text x="40" y="70" text-anchor="start" font-size="11" font-weight="400" fill="#3a4a5a">Thứ tự các cổng là điểm cốt lõi: chữ ký container được kiểm TRƯỚC khi mật khẩu được dùng, nên việc tệp bị sửa không thể bị lợi dụng làm oracle đoán mật khẩu.</text>
<text class="src" x="26" y="984">Nguon: src-tauri/src/service.rs add_item/write_vault/decrypt_archive; crates/sv-core/src/container.rs pack_archive/encode/write_atomic</text>
</svg>