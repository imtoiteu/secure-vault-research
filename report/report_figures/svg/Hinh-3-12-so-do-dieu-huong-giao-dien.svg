<text x="710.0" y="652.25" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4A4210">Bản địa hóa</text>
<text x="710.0" y="666.75" text-anchor="middle" font-size="10" fill="#4A4210bb">i18n.js với DEFAULT_LANG = &quot;vi&quot;: toàn bộ nhãn, thông điệp và mã lỗi được dịch; tiếng Anh</text>
<text x="710.0" y="679.25" text-anchor="middle" font-size="10" fill="#4A4210bb">là ngôn ngữ dự phòng</text>
<text x="50" y="730" text-anchor="start" font-size="11" font-weight="400" fill="#3a4a5a">Hai màn hình &quot;sắp có&quot; (soon-hide, soon-detect) còn sót lại trong mã HTML nhưng không được nối vào thanh điều hướng và không gọi lệnh nào — đây là mã giao diện chết đã được ghi nhận trong bảng đối</text>
<text x="50" y="744" text-anchor="start" font-size="11" font-weight="400" fill="#3a4a5a">chiếu tài liệu ↔ mã nguồn (mục D-12).</text>
<text class="src" x="26" y="734">Nguồn: desktop/frontend/index.html (data-screen), main.js showScreen/wireSidebar, i18n.js</text>
