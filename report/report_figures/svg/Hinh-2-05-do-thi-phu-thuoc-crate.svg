<text x="60" y="745.0" text-anchor="start" font-size="10.8" font-weight="400" fill="#3a4a5a">Hai điểm quan trọng: (1) sv-core chỉ phụ thuộc ABI trong bản dựng sản phẩm; (2) tiến trình con age chỉ được nối dây ở gốc lắp ghép, nên phụ thuộc nhị phân ngoài không lan vào tầng nghiệp vụ.</text>
