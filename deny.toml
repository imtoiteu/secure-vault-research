# cargo-deny configuration — supply-chain gate (runs in CI).
#
# NOTE on licensing posture: per project direction, license is *documented, not a
# rejection criterion* for the bundled OSS tools (age/sss/libsodium/etc., which are
# separate artifacts). For the Rust *dependency graph* below we still enforce a known
# allow-list so an unexpected/unknown license is surfaced for review.

[advisories]
version = 2
yanked = "deny"
# version=2 defaults: vulnerabilities = deny, unmaintained = warn.

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true   # intra-workspace `path` deps legitimately omit a version

[sources]
unknown-registry = "deny"
unknown-git = "deny"
