<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="600" viewBox="0 0 1040 600" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect width="1040" height="600" fill="#FFFFFF"/>
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#55607A"/></marker></defs>
<text x="520.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#12203A">Sơ đồ phân cấp khoá và luồng mở két</text>
<text x="520.0" y="56" font-size="13" text-anchor="middle" fill="#5A6779">Mật khẩu không bao giờ được lưu; khoá chính chỉ tồn tại trong bộ nhớ phiên</text>
<line x1="260" y1="131" x2="330" y2="131" stroke="#55607A" stroke-width="1.7" marker-end="url(#ah)"/>
<line x1="570" y1="131" x2="640" y2="131" stroke="#55607A" stroke-width="1.7" marker-end="url(#ah)"/>
<line x1="700" y1="166" x2="225" y2="246" stroke="#55607A" stroke-width="1.7" marker-end="url(#ah)"/>
<line x1="720" y1="166" x2="485" y2="246" stroke="#55607A" stroke-width="1.7" marker-end="url(#ah)"/>
<line x1="750" y1="166" x2="765" y2="246" stroke="#55607A" stroke-width="1.7" marker-end="url(#ah)"/>
<line x1="225" y1="322" x2="400" y2="392" stroke="#55607A" stroke-width="1.7" marker-end="url(#ah)"/>
<line x1="485" y1="322" x2="500" y2="392" stroke="#55607A" stroke-width="1.7" marker-end="url(#ah)"/>
<rect x="60" y="96" width="200" height="70" rx="7" fill="#E8EBFA" stroke="#4C51BF" stroke-width="1.6"/>
<text x="160.0" y="118.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#242A6B">Mật khẩu người dùng</text>
<text x="160.0" y="135.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#4B5768">chỉ tồn tại trong RAM,</text>
<text x="160.0" y="152.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#4B5768">xoá sạch sau khi dùng</text>
<rect x="330" y="96" width="240" height="70" rx="7" fill="#E7F4EC" stroke="#2E7D4F" stroke-width="1.6"/>
<text x="450.0" y="118.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#14432A">Argon2id</text>
<text x="450.0" y="135.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#4B5768">ngưỡng tối thiểu 19 MiB,</text>
<text x="450.0" y="152.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#4B5768">2 vòng lặp (theo OWASP)</text>
<rect x="640" y="96" width="200" height="70" rx="7" fill="#E7F4EC" stroke="#2E7D4F" stroke-width="1.6"/>
<text x="740.0" y="118.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#14432A">Khoá chính (MK)</text>
<text x="740.0" y="135.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#4B5768">32 byte, chỉ trong</text>
<text x="740.0" y="152.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#4B5768">bộ nhớ phiên</text>
<rect x="120" y="246" width="210" height="76" rx="7" fill="#E7F4EC" stroke="#2E7D4F" stroke-width="1.6"/>
<text x="225.0" y="271.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#14432A">Khoá bọc danh tính age</text>
<text x="225.0" y="288.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#4B5768">(BLAKE3 derive_key)</text>
<text x="225.0" y="305.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#4B5768">mở khoá nội dung két</text>
<rect x="380" y="246" width="210" height="76" rx="7" fill="#E7F4EC" stroke="#2E7D4F" stroke-width="1.6"/>
<text x="485.0" y="271.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#14432A">Khoá bọc khoá ký</text>
<text x="485.0" y="288.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#4B5768">(BLAKE3 derive_key)</text>
<text x="485.0" y="305.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#4B5768">ký tệp bằng két</text>
<rect x="640" y="246" width="250" height="76" rx="7" fill="#E7F4EC" stroke="#2E7D4F" stroke-width="1.6"/>
<text x="765.0" y="271.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#14432A">Khoá phục hồi (tuỳ chọn)</text>
<text x="765.0" y="288.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#4B5768">chia Shamir k trong n</text>
<text x="765.0" y="305.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#4B5768">khôi phục khi mất mật khẩu</text>
<rect x="250" y="392" width="520" height="76" rx="7" fill="#E7F4EC" stroke="#2E7D4F" stroke-width="1.6"/>
<text x="510.0" y="417.0" font-size="13.5" font-weight="600" text-anchor="middle" fill="#14432A">Nội dung két: một luồng age v1 (X25519 + ChaCha20-Poly1305)</text>
<text x="510.0" y="434.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#4B5768">danh mục tệp được mã hoá; chữ ký minisign/Ed25519 ràng buộc phần đầu</text>
<text x="510.0" y="451.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#4B5768">phát hiện được mọi sửa đổi hoặc ghép nối tệp</text>
<text x="520" y="520" font-size="12.5" font-weight="400" text-anchor="middle" fill="#4B5768">Sai mật khẩu và tệp hỏng trả về hai mã lỗi khác nhau nhưng không tiết lộ thông tin phân biệt được (oracle-safe)</text>
</svg>