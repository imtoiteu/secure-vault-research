# Secure Vault — Cargo workspace (Security & Privacy Toolkit core)
# Phase 1 is complete: the M0 frozen contracts (docs/M0-CONTRACTS.md) are now implemented through
# M7 — real crypto adapters (BLAKE3, Argon2id, libsodium secretbox/Ed25519-minisign, Shamir, age),
# the .svault vault (sv-core), the vault-free sv-platform services, and the stego/meta/qr/watermark
# modules. Architecture & boundaries: docs/architecture/ (docs/M0-CONTRACTS.md = the frozen ABI).
[workspace]
resolver = "2"
members = [
    "crates/sv-types",
    "crates/sv-crypto-traits",
    "crates/sv-crypto",
    "crates/sv-platform",
    "crates/sv-stego",
    "crates/sv-meta",
    "crates/sv-qr",
    "crates/sv-watermark",
    "crates/sv-core",
    "crates/sv-age",
    "crates/sv-sys-sss",
    "crates/sv-sys-sodium",
    "src-tauri",
]
# The Tauri shell is intentionally OUT of this workspace: its heavy, platform-specific
# (webview) dependency tree must not enter the audited core's build/lock/deny gates. It is a
# standalone crate that depends on the core via path; build it from `app/` with the Tauri
# toolchain (`cargo tauri dev`, `cargo tauri android dev`). One crate serves desktop, Android
# and iOS — see app/README.md.
exclude = ["app"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
publish = false

# Single source of truth for third-party dependency versions across all crates.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
ciborium = "0.2"            # CBOR (RFC 8949) for the authenticated vault header
zeroize = { version = "1", features = ["derive", "zeroize_derive"] }
thiserror = "1"
hex = "0.4"

# Workspace-wide lints. CI additionally escalates all warnings to errors via
# RUSTFLAGS="-D warnings" and `cargo clippy -- -D warnings`.
[workspace.lints.rust]
unsafe_code = "deny"       # workspace-wide; the FFI sys-crates (sv-sys-sodium/sv-sys-sss) opt out locally
missing_debug_implementations = "warn"

[workspace.lints.clippy]
todo = "allow"             # residual allowance; the M0 `todo!()` adapter stubs are gone (M1–M7 implemented)
