name: ci

# This workflow assumes the `secure-vault/` directory is the git repository root
# (this file lives at <repo>/.github/workflows/ci.yml).

on:
  push:
    branches: [main]
  pull_request:

# M0 verification gates. Everything here must be green before any milestone merges.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"           # escalate all warnings to errors

jobs:
  # ---- cross-platform build / test / lint matrix ----------------------------
  check:
    name: build+test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # `go` is preinstalled on the ubuntu/windows runners but NOT on `macos-latest` (arm64),
      # where `go install` below fails with "go: command not found". Set Go up explicitly on
      # every OS so the age install is reproducible.
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      # Install age on EVERY OS and point the e2e test at it, so the age-backed
      # `age_backed_lifecycle_roundtrips` test actually runs on Windows/macOS — not just Linux.
      # On Windows this is the validation for H4 (does `Command::env_clear()` break the age
      # subprocess?): if the cleared environment breaks age-keygen/age, this test fails the
      # Windows job. (Real GitHub-hosted Windows runner — see docs/RELEASE-READINESS.md §H4.)
      - name: Install age + age-keygen for the sv-age e2e tests (all OSes)
        shell: bash
        run: |
          go install filippo.io/age/cmd/age@v1.2.1
          go install filippo.io/age/cmd/age-keygen@v1.2.1
          BIN="$(go env GOPATH)/bin"
          if [ "$RUNNER_OS" = "Windows" ]; then EXT=".exe"; else EXT=""; fi
          echo "SV_AGE_BIN=${BIN}/age${EXT}" >> "$GITHUB_ENV"
          echo "SV_AGE_KEYGEN_BIN=${BIN}/age-keygen${EXT}" >> "$GITHUB_ENV"
      - name: rustfmt (check)
        run: cargo fmt --all --check
      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build
        run: cargo build --workspace --locked
      - name: test
        run: cargo test --workspace --locked

  # ---- MSRV gate ------------------------------------------------------------
  # The crates declare rust-version = "1.96"; this job enforces it (the matrix above floats on
  # @stable, so without this the declared MSRV could silently rot).
  msrv:
    name: msrv (1.96)
    runs-on: ubuntu-latest
    # `rust-toolchain.toml` pins `channel = "stable"`, which otherwise OVERRIDES the 1.96 toolchain
    # installed below (and would silently build on stable, defeating the MSRV gate). The env var has
    # the highest rustup precedence, so it forces 1.96 for every cargo invocation in this job.
    env:
      RUSTUP_TOOLCHAIN: "1.96"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
      - name: build on the declared MSRV
        run: cargo build --workspace --locked

  # ---- desktop crate gates --------------------------------------------------
  # The Tauri shell (`app/`) is workspace-excluded so the webview dep tree never enters the
  # audited-core gates above. It still must pass fmt/clippy/test on its own and have its (much
  # larger) dependency tree audited. Runs the OS matrix because the webview backend is per-OS.
  app:
    name: app shell build+test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Tauri's Linux backend needs the system WebKitGTK/soup headers (built in on macOS/Windows).
      - name: Linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: rustfmt (check)
        run: cargo fmt --all --check
      - name: clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: test (ApiError↔UI contract + commands)
        run: cargo test --locked

  # ---- supply-chain gates ---------------------------------------------------
  supply-chain:
    name: cargo-deny + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - name: cargo-deny — audited core (advisories, licenses, bans, sources)
        run: cargo deny check
      - name: cargo-audit — audited core (RUSTSEC)
        run: cargo audit
      # The desktop crate is workspace-excluded, so its ~400-package webview tree would otherwise
      # escape advisory/audit scanning entirely. Scan it too (advisories + yanked).
      - name: cargo-deny — app shell webview tree (advisories + bans + sources)
        working-directory: app
        run: cargo deny check advisories bans sources
      - name: cargo-audit — app shell webview tree (RUSTSEC)
        working-directory: app
        run: cargo audit

  # ---- Mobile: the audited core must cross-compile to Android ---------------
  # Uses the NDK preinstalled on the GitHub runner rather than a third-party setup action, so
  # the toolchain comes from the runner image and adds no supply-chain surface to this repo.
  android-core:
    name: android core cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Cross-compile the audited core for Android
        shell: bash
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "using NDK at $NDK"
          for t in aarch64-linux-android x86_64-linux-android; do
            case "$t" in
              aarch64*) CLANG="$TC/aarch64-linux-android24-clang" ;;
              x86_64*)  CLANG="$TC/x86_64-linux-android24-clang" ;;
            esac
            UP=$(echo "$t" | tr 'a-z-' 'A-Z_')
            env "CC_${t//-/_}=$CLANG" \
                "AR_${t//-/_}=$TC/llvm-ar" \
                "CARGO_TARGET_${UP}_LINKER=$CLANG" \
                cargo build --workspace --locked --target "$t"
          done

  # ---- Mobile: run the real test suite on ARM64 -----------------------------
  # Deliberately aarch64-unknown-linux-gnu, NOT the Android triple: Android binaries link
  # against bionic, which QEMU user-mode cannot resolve without an Android sysroot. The pure-Rust
  # and C code under test is identical, so this exercises real ARM64 codegen — which is the
  # point. It does not execute Android binaries and must not be described as if it did.
  android-arm64-tests:
    name: core suite on ARM64 (QEMU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install the cross toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user-static
      - name: Run the core suite on emulated ARM64
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64-static -L /usr/aarch64-linux-gnu
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: cargo test --workspace --locked --target aarch64-unknown-linux-gnu

  # ---- SBOM stub ------------------------------------------------------------
  sbom:
    name: sbom (stub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: bash scripts/sbom.sh sbom-stub.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-stub
          path: sbom-stub.txt
