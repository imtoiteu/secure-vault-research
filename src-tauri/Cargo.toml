[package]
name = "sv-app"
description = "Application/IPC command surface + composition root. Backend-only (no `tauri` dep); the Tauri runtime shell lives in the workspace-excluded desktop/ crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sv-types = { path = "../crates/sv-types" }
sv-core = { path = "../crates/sv-core" }
# Composition root (M6): concrete crypto adapters + age subprocess are wired here, keeping
# sv-core's production graph backend-/FFI-free.
sv-crypto-traits = { path = "../crates/sv-crypto-traits" }
sv-crypto = { path = "../crates/sv-crypto" }
sv-age = { path = "../crates/sv-age" }
# Vault-free file-level crypto services (Integrity + Cryptography modules).
sv-platform = { path = "../crates/sv-platform" }
# Steganography module (Hide / Extract / Detect over image covers; encrypt-then-embed).
sv-stego = { path = "../crates/sv-stego" }
# Analysis module (Metadata Inspect / Sanitize / Compare via a hardened, hash-pinned ExifTool).
sv-meta = { path = "../crates/sv-meta" }
# Secure QR Transfer codec (text ⇄ QR PNG); composed with Secret Sharing to move piece strings.
sv-qr = { path = "../crates/sv-qr" }
# Watermarking module (invisible, keyed, fragile tamper-evident image watermark; embed / verify).
sv-watermark = { path = "../crates/sv-watermark" }
serde.workspace = true
zeroize.workspace = true
hex.workspace = true
getrandom = "0.2"
# Same-directory temp staging for the Secret Sharing recover bridge (pasted Base64 pieces are
# written to a throwaway dir, then handed to the unchanged file-based engine). RAII cleanup.
tempfile = "3"

[dev-dependencies]
serde_json = "1"
# Synthesize PNG covers in the stego command tests (already in the workspace tree via sv-stego).
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true
