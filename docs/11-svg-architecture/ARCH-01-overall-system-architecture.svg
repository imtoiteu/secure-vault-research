  <rect x="0" y="0" width="1240" height="985" fill="#ffffff"/>
  <text x="40" y="44" class="title">ARCH-01 · Overall System Architecture</text>
  <text x="40" y="66" class="subtitle">User → Tauri WebView → IPC command surface → composition root → domain crates → shared crypto platform → bundled backends</text>
  <line x1="40" y1="76" x2="1200" y2="76" stroke="#aab2bf" stroke-width="1"/>
<text x="44" y="121" class="gut" text-anchor="start">USER</text><rect x="540" y="92" width="270" height="50" rx="7" ry="7" fill="#f4f6f9" stroke="#5b6675" stroke-width="1.3"/><text x="675" y="115.75" class="nodeb" text-anchor="middle">User</text><text x="675" y="131.75" class="sub" text-anchor="middle">local · single host · offline</text><line x1="675" y1="142" x2="675" y2="172" stroke="#566072" stroke-width="1.6" marker-end="url(#arrow)"/><text x="44" y="212" class="gut" text-anchor="start">PRESENTATION</text><rect x="160" y="176" width="1030" height="64" rx="7" ry="7" fill="#e9f1fd" stroke="#2f6ab0" stroke-width="1.3"/><text x="675" y="200" class="nodeb" text-anchor="middle">Tauri 2 WebView — static frontend (withGlobalTauri)</text><text x="675" y="216" class="sub" text-anchor="middle">index.html · main.js · i18n.js · styles.css</text><text x="675" y="229.5" class="sub" text-anchor="middle">22 screen sections (20 routable) · vi/en i18n · CSP: no inline scripts</text><line x1="675" y1="240" x2="675" y2="270" stroke="#566072" stroke-width="1.6" marker-end="url(#arrow)"/><text x="44" y="301" class="gut" text-anchor="start">IPC BOUNDARY</text><rect x="160" y="272" width="1030" height="50" rx="7" ry="7" fill="#fdf3e2" stroke="#b9791b" stroke-width="1.3"/><text x="675" y="295.75" class="node" text-anchor="middle">IPC — Tauri invoke · 38 commands · coded oracle-safe ApiError</text><text x="675" y="311.75" class="sub" text-anchor="middle">IpcPassphrase (zeroizing) · file paths cross the boundary, never secret bytes</text><line x1="675" y1="322" x2="675" y2="352" stroke="#566072" stroke-width="1.6" marker-end="url(#arrow)"/><text x="44" y="400" class="gut" text-anchor="start">COMPOSITION</text><rect x="160" y="354" width="1030" height="92" rx="7" ry="7" fill="#eef0f6" stroke="#46506a" stroke-width="1.3"/><text x="675" y="405.5" class="node" text-anchor="middle">sv-app composition root  (desktop/src/lib.rs + src-tauri)</text><rect x="180" y="396" width="187" height="36" rx="7" ry="7" fill="#f4f6f9" stroke="#5b6675" stroke-width="1.3"/><text x="273.5" y="412.75" class="node" text-anchor="middle">Backend</text><text x="273.5" y="428.75" class="sub" text-anchor="middle">vault</text><rect x="381" y="396" width="187" height="36" rx="7" ry="7" fill="#f4f6f9" stroke="#5b6675" stroke-width="1.3"/><text x="474.5" y="412.75" class="node" text-anchor="middle">Platform</text><text x="474.5" y="428.75" class="sub" text-anchor="middle">crypto/share/QR</text><rect x="582" y="396" width="187" height="36" rx="7" ry="7" fill="#f4f6f9" stroke="#5b6675" stroke-width="1.3"/><text x="675.5" y="412.75" class="node" text-anchor="middle">Stego</text><text x="675.5" y="428.75" class="sub" text-anchor="middle">conceal</text><rect x="783" y="396" width="187" height="36" rx="7" ry="7" fill="#f4f6f9" stroke="#5b6675" stroke-width="1.3"/><text x="876.5" y="412.75" class="node" text-anchor="middle">Meta</text><text x="876.5" y="428.75" class="sub" text-anchor="middle">metadata</text><rect x="984" y="396" width="187" height="36" rx="7" ry="7" fill="#f4f6f9" stroke="#5b6675" stroke-width="1.3"/><text x="1077.5" y="412.75" class="node" text-anchor="middle">Watermark</text><text x="1077.5" y="428.75" class="sub" text-anchor="middle">tamper-evidence</text><text x="1182" y="372" class="tag" text-anchor="end" fill="#46506a">5 managed states</text><line x1="675" y1="446" x2="675" y2="476" stroke="#566072" stroke-width="1.6" marker-end="url(#arrow)"/><text x="44" y="520" class="gut" text-anchor="start">DOMAIN CRATES</text><rect x="160" y="480" width="160" height="80" rx="7" ry="7" fill="#eaf3ee" stroke="#3c7d4f" stroke-width="1.3"/><text x="240" y="518.75" class="node" text-anchor="middle">sv-core</text><text x="240" y="534.75" class="sub" text-anchor="middle">Secure Vault</text><rect x="334" y="480" width="160" height="80" rx="7" ry="7" fill="#eaf3ee" stroke="#3c7d4f" stroke-width="1.3"/><text x="414" y="518.75" class="node" text-anchor="middle">sv-platform</text><text x="414" y="534.75" class="sub" text-anchor="middle">File crypto services</text><rect x="508" y="480" width="160" height="80" rx="7" ry="7" fill="#eaf3ee" stroke="#3c7d4f" stroke-width="1.3"/><text x="588" y="518.75" class="node" text-anchor="middle">sv-stego</text><text x="588" y="534.75" class="sub" text-anchor="middle">Steganography</text><rect x="682" y="480" width="160" height="80" rx="7" ry="7" fill="#eaf3ee" stroke="#3c7d4f" stroke-width="1.3"/><text x="762" y="518.75" class="node" text-anchor="middle">sv-meta</text><text x="762" y="534.75" class="sub" text-anchor="middle">Metadata (ExifTool)</text><rect x="856" y="480" width="160" height="80" rx="7" ry="7" fill="#eaf3ee" stroke="#3c7d4f" stroke-width="1.3"/><text x="936" y="518.75" class="node" text-anchor="middle">sv-qr</text><text x="936" y="534.75" class="sub" text-anchor="middle">QR transfer</text><rect x="1030" y="480" width="160" height="80" rx="7" ry="7" fill="#eaf3ee" stroke="#3c7d4f" stroke-width="1.3"/><text x="1110" y="518.75" class="node" text-anchor="middle">sv-watermark</text><text x="1110" y="534.75" class="sub" text-anchor="middle">Tamper-evidence</text><line x1="675" y1="560" x2="675" y2="590" stroke="#566072" stroke-width="1.6" marker-end="url(#arrow)"/><text x="44" y="633" class="gut" text-anchor="start">CRYPTO PLATFORM</text><rect x="160" y="594" width="332" height="78" rx="7" ry="7" fill="#e7f1f2" stroke="#2f7b86" stroke-width="1.3"/><text x="326" y="625" class="node" text-anchor="middle">sv-crypto-traits</text><text x="326" y="641" class="sub" text-anchor="middle">backend-free crypto ABI</text><text x="326" y="654.5" class="sub" text-anchor="middle">secret types: Key32 · SecretBytes</text><rect x="509" y="594" width="332" height="78" rx="7" ry="7" fill="#fbe9e9" stroke="#b0413f" stroke-width="2"/><text x="675" y="625" class="node" text-anchor="middle">sv-crypto (impl adapters)</text><text x="675" y="641" class="sub" text-anchor="middle">BLAKE3 · Argon2id · secretbox</text><text x="675" y="654.5" class="sub" text-anchor="middle">Ed25519-minisign · Shamir</text><circle cx="830" cy="605" r="4.2" fill="#b0413f"/><rect x="858" y="594" width="332" height="78" rx="7" ry="7" fill="#e7f1f2" stroke="#2f7b86" stroke-width="1.3"/><text x="1024" y="625" class="node" text-anchor="middle">sv-types</text><text x="1024" y="641" class="sub" text-anchor="middle">DTO + coded error 'island'</text><text x="1024" y="654.5" class="sub" text-anchor="middle">(zero crypto deps)</text><line x1="675" y1="672" x2="675" y2="702" stroke="#566072" stroke-width="1.6" marker-end="url(#arrow)"/><text x="44" y="747" class="gut" text-anchor="start">BACKENDS / TOOLS</text><rect x="160" y="706" width="247" height="82" rx="7" ry="7" fill="#fbe9e9" stroke="#b0413f" stroke-width="2"/><text x="283.5" y="745.75" class="node" text-anchor="middle">libsodium</text><text x="283.5" y="761.75" class="sub" text-anchor="middle">FFI · secretbox / Ed25519</text><circle cx="396" cy="717" r="4.2" fill="#b0413f"/><rect x="421" y="706" width="247" height="82" rx="7" ry="7" fill="#fbe9e9" stroke="#b0413f" stroke-width="2"/><text x="544.5" y="745.75" class="node" text-anchor="middle">Shamir sss</text><text x="544.5" y="761.75" class="sub" text-anchor="middle">vendored FFI (static C)</text><circle cx="657" cy="717" r="4.2" fill="#b0413f"/><rect x="682" y="706" width="247" height="82" rx="7" ry="7" fill="#fbe9e9" stroke="#b0413f" stroke-width="2"/><text x="805.5" y="745.75" class="node" text-anchor="middle">age / age-keygen</text><text x="805.5" y="761.75" class="sub" text-anchor="middle">subprocess · BLAKE3-pinned</text><circle cx="918" cy="717" r="4.2" fill="#b0413f"/><rect x="943" y="706" width="247" height="82" rx="7" ry="7" fill="#efeaf8" stroke="#6a4f9c" stroke-width="1.3"/><text x="1066.5" y="745.75" class="node" text-anchor="middle">ExifTool</text><text x="1066.5" y="761.75" class="sub" text-anchor="middle">subprocess · pinned · optional</text><rect x="40" y="812" width="286" height="180" rx="7" fill="#ffffff" stroke="#aab2bf" stroke-width="1"/><text x="52" y="831" class="zone" text-anchor="start">Legend</text><rect x="52" y="841" width="17" height="12" rx="2.5" fill="#e9f1fd" stroke="#2f6ab0" stroke-width="1.2"/><text x="78" y="851" class="legend" text-anchor="start">Presentation (WebView)</text><rect x="52" y="860" width="17" height="12" rx="2.5" fill="#fdf3e2" stroke="#b9791b" stroke-width="1.2"/><text x="78" y="870" class="legend" text-anchor="start">IPC boundary</text><rect x="52" y="879" width="17" height="12" rx="2.5" fill="#eef0f6" stroke="#46506a" stroke-width="1.2"/><text x="78" y="889" class="legend" text-anchor="start">Composition root</text><rect x="52" y="898" width="17" height="12" rx="2.5" fill="#eaf3ee" stroke="#3c7d4f" stroke-width="1.2"/><text x="78" y="908" class="legend" text-anchor="start">Domain crate (module)</text><rect x="52" y="917" width="17" height="12" rx="2.5" fill="#e7f1f2" stroke="#2f7b86" stroke-width="1.2"/><text x="78" y="927" class="legend" text-anchor="start">Shared crypto platform</text><rect x="52" y="936" width="17" height="12" rx="2.5" fill="#fbe9e9" stroke="#b0413f" stroke-width="2"/><circle cx="65" cy="939.5" r="2.4" fill="#b0413f"/><text x="78" y="946" class="legend" text-anchor="start">Security-critical (keys / crypto / FFI)</text><rect x="52" y="955" width="17" height="12" rx="2.5" fill="#efeaf8" stroke="#6a4f9c" stroke-width="1.2"/><text x="78" y="965" class="legend" text-anchor="start">External bundled tool</text><line x1="52" y1="980" x2="69" y2="980" stroke="#566072" stroke-width="1.8" marker-end="url(#arrow)"/><text x="78" y="984" class="legend" text-anchor="start">calls / depends-on (top → down)</text><rect x="360" y="812" width="840" height="180" rx="7" fill="#ffffff" stroke="#aab2bf"/><text x="372" y="831" class="zone" text-anchor="start">How to read</text><text x="372" y="851" class="sub" text-anchor="start">• A single offline desktop app: the WebView calls the Rust core only through the typed IPC surface;</text><text x="372" y="870" class="sub" text-anchor="start">   no secret value crosses that boundary (the one documented residual is the passphrase string).</text><text x="372" y="889" class="sub" text-anchor="start">• The composition root owns 5 managed states and exposes 38 #[tauri::command]s that dispatch to the</text><text x="372" y="908" class="sub" text-anchor="start">   six domain crates.</text><text x="372" y="927" class="sub" text-anchor="start">• Every domain crate reuses the shared platform; only sv-crypto, the FFI backends and the age</text><text x="372" y="946" class="sub" text-anchor="start">   subprocess are security-critical (red).</text><text x="372" y="965" class="sub" text-anchor="start">• sv-types has no crypto dependencies — a DTO structurally cannot carry a secret.</text><text x="372" y="984" class="sub" text-anchor="start">• No network egress anywhere in the system.</text>
  <line x1="40" y1="951" x2="1200" y2="951" stroke="#aab2bf" stroke-width="1"/>
  <text x="40" y="969" class="foot">Secure Vault — Security &amp; Privacy Toolkit · v0.1.0   |   Source of truth: source code under secure-vault/ (see 11-svg-architecture/README.md)</text>
</svg>
