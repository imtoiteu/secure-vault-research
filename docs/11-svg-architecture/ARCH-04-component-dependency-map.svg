40" y2="518" stroke="#6a4f9c" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><line x1="915" y1="403" x2="1140" y2="418" stroke="#6a4f9c" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="40" y="880" width="286" height="180" rx="7" fill="#ffffff" stroke="#aab2bf" stroke-width="1"/><text x="52" y="899" class="zone" text-anchor="start">Legend</text><rect x="52" y="909" width="17" height="12" rx="2.5" fill="#e9f1fd" stroke="#2f6ab0" stroke-width="1.2"/><text x="78" y="919" class="legend" text-anchor="start">Tauri shell (workspace-excluded)</text><rect x="52" y="928" width="17" height="12" rx="2.5" fill="#eef0f6" stroke="#46506a" stroke-width="1.2"/><text x="78" y="938" class="legend" text-anchor="start">Composition root</text><rect x="52" y="947" width="17" height="12" rx="2.5" fill="#eaf3ee" stroke="#3c7d4f" stroke-width="1.2"/><text x="78" y="957" class="legend" text-anchor="start">Domain crate</text><rect x="52" y="966" width="17" height="12" rx="2.5" fill="#e7f1f2" stroke="#2f7b86" stroke-width="1.2"/><text x="78" y="976" class="legend" text-anchor="start">Shared ABI / DTO (leaf)</text><rect x="52" y="985" width="17" height="12" rx="2.5" fill="#fbe9e9" stroke="#b0413f" stroke-width="2"/><circle cx="65" cy="988.5" r="2.4" fill="#b0413f"/><text x="78" y="995" class="legend" text-anchor="start">Security-critical component</text><rect x="52" y="1004" width="17" height="12" rx="2.5" fill="#efeaf8" stroke="#6a4f9c" stroke-width="1.2"/><text x="78" y="1014" class="legend" text-anchor="start">External binary (runtime spawn)</text><line x1="52" y1="1029" x2="69" y2="1029" stroke="#566072" stroke-width="1.8" marker-end="url(#arrow)"/><text x="78" y="1033" class="legend" text-anchor="start">cargo dependency (depends-on)</text><line x1="52" y1="1048" x2="69" y2="1048" stroke="#566072" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrow)"/><text x="78" y="1052" class="legend" text-anchor="start">dev-dependency / runtime spawn</text><rect x="360" y="880" width="880" height="180" rx="7" fill="#ffffff" stroke="#aab2bf"/><text x="372" y="899" class="zone" text-anchor="start">Reading the graph</text><text x="372" y="919" class="sub" text-anchor="start">• Edges are exact internal Cargo path-dependencies (verified from each crate's Cargo.toml). An arrow A → B means "A depends on B".</text><text x="372" y="938" class="sub" text-anchor="start">• sv-crypto-traits is the dependency-light ABI root; sv-types is a leaf with zero crypto deps (so DTOs cannot hold secrets).</text><text x="372" y="957" class="sub" text-anchor="start">• sv-core takes sv-crypto only as a dev-dependency (dashed) — the production vault is generic over the ABI and FFI-free.</text><text x="372" y="976" class="sub" text-anchor="start">• For legibility, sv-app's direct edges to sv-crypto-traits / sv-crypto / sv-types and desktop's edge to sv-types are omitted</text><text x="372" y="995" class="sub" text-anchor="start">    (they exist in the manifests). All other edges are drawn.</text><text x="372" y="1014" class="sub" text-anchor="start">• Security-critical = handles key material, performs cryptography, links C/FFI, or executes an external binary.</text><text x="372" y="1033" class="sub" text-anchor="start">• age / ExifTool edges are runtime subprocess spawns (hash-pinned), not compile-time dependencies.</text>
  <line x1="40" y1="1066" x2="1240" y2="1066" stroke="#aab2bf" stroke-width="1"/>
