<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1010" viewBox="0 0 1240 1010" role="img" aria-label="ARCH-02 · Security &amp; Trust Boundaries">

  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1c2330; }
    .title { font-size: 25px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #5b6675; }
    .zone { font-size: 12.5px; font-weight: 700; }
    .node { font-size: 13px; font-weight: 600; }
    .nodeb { font-size: 14px; font-weight: 700; }
    .sub { font-size: 10.8px; fill: #45505f; }
    .lbl { font-size: 10.5px; fill: #34404f; }
    .legend { font-size: 11.3px; }
    .foot { font-size: 10.3px; fill: #5b6675; }
    .gut { font-size: 11px; font-weight: 700; fill: #5b6675; letter-spacing: 0.4px; }
    .tag { font-size: 10.5px; font-weight: 700; }
  </style>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7.6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#566072"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1240" height="1010" fill="#ffffff"/>
  <text x="40" y="44" class="title">ARCH-02 · Security &amp; Trust Boundaries</text>
  <text x="40" y="66" class="subtitle">Trust zones from untrusted user input through the sandboxed WebView, the trusted native backend and crypto core, to hardened subprocesses and storage</text>
  <line x1="40" y1="76" x2="1200" y2="76" stroke="#aab2bf" stroke-width="1"/>
<rect x="70" y="92" width="1100" height="58" rx="9" fill="#eceff3" stroke="#5d6b7c" stroke-width="1.4"/><rect x="86" y="106" width="142" height="24" rx="5" fill="#5d6b7c"/><text x="157" y="123" class="tag" text-anchor="middle" fill="#ffffff">UNTRUSTED</text><text x="244" y="117" class="nodeb" text-anchor="start">User input</text><text x="244" y="139" class="sub" text-anchor="start">File paths, passphrases, images selected by the user — treated as untrusted input.</text><rect x="70" y="176" width="1100" height="96" rx="9" fill="#e9f1fd" stroke="#2f6ab0" stroke-width="1.4"/><rect x="86" y="190" width="142" height="24" rx="5" fill="#2f6ab0"/><text x="157" y="207" class="tag" text-anchor="middle" fill="#ffffff">SANDBOXED</text><text x="244" y="201" class="nodeb" text-anchor="start">Frontend — Tauri WebView (static withGlobalTauri)</text><text x="244" y="223" class="sub" text-anchor="start">CSP: default-src 'self'; no inline scripts.   Capability allowlist: core / dialog / opener only — no fs: / shell:.</text><text x="244" y="237" class="sub" text-anchor="start">Renders all values via textContent (no HTML injection).   Password fields zeroed on navigation and after each task.</text><line x1="70" y1="300" x2="1170" y2="300" stroke="#b0413f" stroke-width="1.6" stroke-dasharray="9 5"/><rect x="518.6" y="287" width="202.79999999999998" height="26" rx="6" fill="#ffffff" stroke="#b0413f" stroke-width="1.3"/><text x="620" y="304" class="zone" text-anchor="middle" fill="#b0413f">IPC TRUST BOUNDARY  (JSON)</text><text x="70" y="318" class="sub" text-anchor="start">Crosses the boundary: file paths + passphrase (zeroizing) — never secret bytes.</text><text x="70" y="332" class="sub" text-anchor="start">Documented residual: serde/JSON copies the passphrase into buffers it cannot zeroize (mitigate via OS disk/swap encryption; exclude these commands from arg logging).</text><rect x="70" y="348" width="1100" height="92" rx="9" fill="#eef0f6" stroke="#46506a" stroke-width="1.4"/><rect x="86" y="362" width="142" height="24" rx="5" fill="#46506a"/><text x="157" y="379" class="tag" text-anchor="middle" fill="#ffffff">TRUSTED</text><text x="244" y="373" class="nodeb" text-anchor="start">Backend — Rust command surface (sv-app)</text><text x="244" y="395" class="sub" text-anchor="start">38 commands · coded, oracle-safe ApiError (wrong-passphrase = wrong-share = Unauthorized).</text><text x="244" y="409" class="sub" text-anchor="start">IpcPassphrase zeroizing · no secret in any DTO · size + decompression-bomb caps · atomic refuse-overwrite writes.</text><line x1="620" y1="440" x2="620" y2="452" stroke="#566072" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="70" y="452" width="1100" height="100" rx="9" fill="#fbe9e9" stroke="#b0413f" stroke-width="2"/><rect x="86" y="466" width="142" height="24" rx="5" fill="#b0413f"/><text x="157" y="483" class="tag" text-anchor="middle" fill="#ffffff">CRITICAL</text><text x="244" y="477" class="nodeb" text-anchor="start">Cryptographic services — shared platform + vault key hierarchy</text><text x="244" y="499" class="sub" text-anchor="start">BLAKE3 · Argon2id · libsodium secretbox / Ed25519-minisign · Shamir.   Signature verified BEFORE the credential gate.</text><text x="244" y="513" class="sub" text-anchor="start">Key32 / SecretBytes zeroize-on-drop · vault master key is RAM-only and never written to disk.</text><circle cx="1156" cy="465" r="4.5" fill="#b0413f"/><line x1="70" y1="580" x2="1170" y2="580" stroke="#b0413f" stroke-width="1.6" stroke-dasharray="9 5"/><rect x="552.6" y="567" width="134.8" height="26" rx="6" fill="#ffffff" stroke="#b0413f" stroke-width="1.3"/><text x="620" y="584" class="zone" text-anchor="middle" fill="#b0413f">PROCESS BOUNDARY</text><text x="1170" y="602" class="lbl" text-anchor="end">env_clear · BLAKE3 hash-pin · wall-clock timeout · fail-closed</text><rect x="70" y="610" width="1100" height="84" rx="9" fill="#efeaf8" stroke="#6a4f9c" stroke-width="1.4"/><rect x="86" y="624" width="142" height="24" rx="5" fill="#6a4f9c"/><text x="157" y="641" class="tag" text-anchor="middle" fill="#ffffff">EXTERNAL</text><text x="244" y="635" class="nodeb" text-anchor="start">Bundled external tools — hardened subprocess</text><text x="244" y="657" class="sub" text-anchor="start">age / age-keygen (file encryption) · ExifTool (metadata).   Spawned with env_clear, a pinned BLAKE3 hash,</text><text x="244" y="671" class="sub" text-anchor="start">a wall-clock timeout, and -config '' for ExifTool (RCE vector closed).   Disabled tool ⇒ fail-closed.</text><line x1="70" y1="722" x2="1170" y2="722" stroke="#b0413f" stroke-width="1.6" stroke-dasharray="9 5"/><rect x="566.2" y="709" width="107.6" height="26" rx="6" fill="#ffffff" stroke="#b0413f" stroke-width="1.3"/><text x="620" y="726" class="zone" text-anchor="middle" fill="#b0413f">I/O BOUNDARY</text><text x="1170" y="744" class="lbl" text-anchor="end">atomic temp → fsync → rename · refuse-overwrite · path-stripped errors</text><rect x="70" y="752" width="1100" height="76" rx="9" fill="#eceff3" stroke="#5d6b7c" stroke-width="1.4"/><rect x="86" y="766" width="142" height="24" rx="5" fill="#5d6b7c"/><text x="157" y="783" class="tag" text-anchor="middle" fill="#ffffff">STORAGE</text><text x="244" y="777" class="nodeb" text-anchor="start">File system</text><text x="244" y="799" class="sub" text-anchor="start">.svault · .svenc / .svkey · .minisig · .svshare / .svss · QR PNG · images · keys — all under the user's own paths.</text><rect x="70" y="858" width="286" height="142" rx="7" fill="#ffffff" stroke="#aab2bf" stroke-width="1"/><text x="82" y="877" class="zone" text-anchor="start">Legend</text><rect x="82" y="887" width="17" height="12" rx="2.5" fill="#eceff3" stroke="#5d6b7c" stroke-width="1.2"/><text x="108" y="897" class="legend" text-anchor="start">Untrusted input / storage</text><rect x="82" y="906" width="17" height="12" rx="2.5" fill="#e9f1fd" stroke="#2f6ab0" stroke-width="1.2"/><text x="108" y="916" class="legend" text-anchor="start">Sandboxed WebView</text><rect x="82" y="925" width="17" height="12" rx="2.5" fill="#eef0f6" stroke="#46506a" stroke-width="1.2"/><text x="108" y="935" class="legend" text-anchor="start">Trusted native backend</text><rect x="82" y="944" width="17" height="12" rx="2.5" fill="#fbe9e9" stroke="#b0413f" stroke-width="2"/><circle cx="95" cy="947.5" r="2.4" fill="#b0413f"/><text x="108" y="954" class="legend" text-anchor="start">Security-critical crypto</text><rect x="82" y="963" width="17" height="12" rx="2.5" fill="#efeaf8" stroke="#6a4f9c" stroke-width="1.2"/><text x="108" y="973" class="legend" text-anchor="start">External process (sandboxed)</text><line x1="82" y1="988" x2="99" y2="988" stroke="#b0413f" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrow)"/><text x="108" y="992" class="legend" text-anchor="start">trust / process / I-O boundary</text><rect x="372" y="858" width="798" height="142" rx="7" fill="#ffffff" stroke="#aab2bf"/><text x="384" y="877" class="zone" text-anchor="start">Boundary controls (defence in depth)</text><text x="384" y="897" class="sub" text-anchor="start">1. WebView → backend: typed IPC only; no direct filesystem or shell access is granted to the page.</text><text x="384" y="916" class="sub" text-anchor="start">2. Backend → crypto: secrets stay in zeroizing types; the vault signature is checked before any passphrase test,</text><text x="384" y="935" class="sub" text-anchor="start">    so tampering is reported as Corrupted, never as an authentication oracle.</text><text x="384" y="954" class="sub" text-anchor="start">3. Backend → tools: external binaries run as cleaned, hash-pinned, time-bounded subprocesses and fail closed.</text><text x="384" y="973" class="sub" text-anchor="start">4. Anything → disk: writes are atomic and refuse to overwrite; error details are path-stripped.</text>
  <line x1="40" y1="976" x2="1200" y2="976" stroke="#aab2bf" stroke-width="1"/>
  <text x="40" y="994" class="foot">Secure Vault — Security &amp; Privacy Toolkit · v0.1.0   |   Source of truth: source code under secure-vault/ (see 11-svg-architecture/README.md)</text>
</svg>
