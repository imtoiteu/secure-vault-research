  <rect x="0" y="0" width="1500" height="880" fill="#ffffff"/>
  <text x="40" y="44" class="title">ARCH-03 · Secure File Lifecycle</text>
  <text x="40" y="66" class="subtitle">End-to-end: file/secret → protect → store · hide · transfer → recover → decrypt, across the Vault, Steganography, Secret-Sharing and QR paths</text>
  <line x1="40" y1="76" x2="1460" y2="76" stroke="#aab2bf" stroke-width="1"/>
<text x="335" y="100" class="zone" text-anchor="middle" fill="#5b6675">PROTECT / OPERATE</text><text x="605" y="100" class="zone" text-anchor="middle" fill="#5b6675">STORE · HIDE · TRANSFER</text><text x="875" y="100" class="zone" text-anchor="middle" fill="#5b6675">RECOVER</text><text x="1145" y="100" class="zone" text-anchor="middle" fill="#5b6675">DECRYPT / OPEN</text><text x="125" y="100" class="zone" text-anchor="middle" fill="#5b6675">INPUT</text><text x="1395" y="100" class="zone" text-anchor="middle" fill="#5b6675">OUTPUT</text><rect x="50" y="300" width="150" height="150" rx="7" ry="7" fill="#f4f6f9" stroke="#5b6675" stroke-width="1.3"/><text x="125" y="367" class="nodeb" text-anchor="middle">Plaintext</text><text x="125" y="383" class="sub" text-anchor="middle">file or secret</text><text x="125" y="396.5" class="sub" text-anchor="middle">(user input)</text><rect x="1320" y="300" width="150" height="150" rx="7" ry="7" fill="#f4f6f9" stroke="#5b6675" stroke-width="1.3"/><text x="1395" y="367" class="nodeb" text-anchor="middle">Recovered</text><text x="1395" y="383" class="sub" text-anchor="middle">plaintext file</text><text x="1395" y="396.5" class="sub" text-anchor="middle">or secret</text><rect x="235" y="118" width="200" height="74" rx="7" ry="7" fill="#eaf3ee" stroke="#3c7d4f" stroke-width="1.3"/><text x="335" y="147" class="node" text-anchor="middle">Vault seal</text><text x="335" y="163" class="sub" text-anchor="middle">Argon2id master · age payload</text><text x="335" y="176.5" class="sub" text-anchor="middle">minisign over binding root</text><rect x="505" y="118" width="200" height="74" rx="7" ry="7" fill="#eaf3ee" stroke="#3c7d4f" stroke-width="1.3"/><text x="605" y="147" class="node" text-anchor="middle">.svault container</text><text x="605" y="163" class="sub" text-anchor="middle">CBOR header + age payload</text><text x="605" y="176.5" class="sub" text-anchor="middle">+ signature, on disk</text><rect x="775" y="118" width="200" height="74" rx="7" ry="7" fill="#eaf3ee" stroke="#3c7d4f" stroke-width="1.3"/><text x="875" y="147" class="node" text-anchor="middle">Unlock</text><text x="875" y="163" class="sub" text-anchor="middle">verify signature → derive key</text><text x="875" y="176.5" class="sub" text-anchor="middle">→ unwrap identity</text><rect x="1045" y="118" width="200" height="74" rx="7" ry="7" fill="#eaf3ee" stroke="#3c7d4f" stroke-width="1.3"/><text x="1145" y="147" class="node" text-anchor="middle">Decrypt items</text><text x="1145" y="163" class="sub" text-anchor="middle">age payload → item bytes</text><text x="1145" y="176.5" class="sub" text-anchor="middle">(extract to file)</text><line x1="200" y1="375" x2="235" y2="155" stroke="#566072" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="435" y1="155" x2="505" y2="155" stroke="#566072" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="705" y1="155" x2="775" y2="155" stroke="#566072" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="975" y1="155" x2="1045" y2="155" stroke="#566072" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="1245" y1="155" x2="1320" y2="375" stroke="#566072" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="235" y="240" width="200" height="74" rx="7" ry="7" fill="#e9f1fd" stroke="#2f6ab0" stroke-width="1.3"/><text x="335" y="269" class="node" text-anchor="middle">Encrypt file</text><text x="335" y="285" class="sub" text-anchor="middle">Argon2id + secretbox</text><text x="335" y="298.5" class="sub" text-anchor="middle">(SVENC artifact)</text><rect x="505" y="240" width="200" height="74" rx="7" ry="7" fill="#e9f1fd" stroke="#2f6ab0" stroke-width="1.3"/><text x="605" y="269" class="node" text-anchor="middle">Encrypted file</text><text x="605" y="285" class="sub" text-anchor="middle">.svenc on disk</text><text x="605" y="298.5" class="sub" text-anchor="middle">move / back up freely</text><rect x="775" y="240" width="200" height="74" rx="7" ry="7" fill="#f4f6f9" stroke="#5b6675" stroke-width="1.3"/><text x="875" y="269" class="node" text-anchor="middle">— (same file)</text><text x="875" y="285" class="sub" text-anchor="middle">no separate recovery step</text><text x="875" y="298.5" class="sub" text-anchor="middle">ciphertext is portable</text><rect x="1045" y="240" width="200" height="74" rx="7" ry="7" fill="#e9f1fd" stroke="#2f6ab0" stroke-width="1.3"/><text x="1145" y="269" class="node" text-anchor="middle">Decrypt file</text><text x="1145" y="285" class="sub" text-anchor="middle">verify MAC → plaintext</text><text x="1145" y="298.5" class="sub" text-anchor="middle">pre-auth cost ceilings</text><line x1="200" y1="375" x2="235" y2="277" stroke="#566072" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="435" y1="277" x2="505" y2="277" stroke="#566072" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="705" y1="277" x2="775" y2="277" stroke="#566072" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="975" y1="277" x2="1045" y2="277" stroke="#566072" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="1245" y1="277" x2="1320" y2="375" stroke="#566072" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="235" y="362" width="200" height="74" rx="7" ry="7" fill="#e7f1f2" stroke="#2f7b86" stroke-width="1.3"/><text x="335" y="391" class="node" text-anchor="middle">Hide</text><text x="335" y="407" class="sub" text-anchor="middle">seal (Argon2id+secretbox)</text><text x="335" y="420.5" class="sub" text-anchor="middle">+ embed LSB / JPEG-DCT</text><rect x="505" y="362" width="200" height="74" rx="7" ry="7" fill="#e7f1f2" stroke="#2f7b86" stroke-width="1.3"/><text x="605" y="391" class="node" text-anchor="middle">Carrier image</text><text x="605" y="407" class="sub" text-anchor="middle">PNG / BMP / JPEG</text><text x="605" y="420.5" class="sub" text-anchor="middle">(visually unchanged)</text><rect x="775" y="362" width="200" height="74" rx="7" ry="7" fill="#e7f1f2" stroke="#2f7b86" stroke-width="1.3"/><text x="875" y="391" class="node" text-anchor="middle">Extract</text><text x="875" y="407" class="sub" text-anchor="middle">read header → re-derive</text><text x="875" y="420.5" class="sub" text-anchor="middle">embedding schedule</text><rect x="1045" y="362" width="200" height="74" rx="7" ry="7" fill="#e7f1f2" stroke="#2f7b86" stroke-width="1.3"/><text x="1145" y="391" class="node" text-anchor="middle">Reveal payload</text><text x="1145" y="407" class="sub" text-anchor="middle">secretbox open</text><text x="1145" y="420.5" class="sub" text-anchor="middle">(wrong key ⇒ AuthFailed)</text><line x1="200" y1="375" x2="235" y2="399" stroke="#566072" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="435" y1="399" x2="505" y2="399" stroke="#566072" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="705" y1="399" x2="775" y2="399" stroke="#566072" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="975" y1="399" x2="1045" y2="399" stroke="#566072" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="1245" y1="399" x2="1320" y2="375" stroke="#566072" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="235" y="500" width="200" height="74" rx="7" ry="7" fill="#eef0f6" stroke="#46506a" stroke-width="1.3"/><text x="335" y="529" class="node" text-anchor="middle">Split</text><text x="335" y="545" class="sub" text-anchor="middle">Shamir k-of-n</text><text x="335" y="558.5" class="sub" text-anchor="middle">SVSH (vault key) / SVSS (DEK)</text><rect x="505" y="500" width="200" height="74" rx="7" ry="7" fill="#eef0f6" stroke="#46506a" stroke-width="1.3"/><text x="605" y="529" class="node" text-anchor="middle">Shares</text><text x="605" y="545" class="sub" text-anchor="middle">.svshare / .svss</text><text x="605" y="558.5" class="sub" text-anchor="middle">distribute to holders</text><rect x="775" y="500" width="200" height="74" rx="7" ry="7" fill="#eef0f6" stroke="#46506a" stroke-width="1.3"/><text x="875" y="529" class="node" text-anchor="middle">Recover</text><text x="875" y="545" class="sub" text-anchor="middle">combine ≥ threshold</text><text x="875" y="558.5" class="sub" text-anchor="middle">(decode QR first if used)</text><rect x="1045" y="500" width="200" height="74" rx="7" ry="7" fill="#eef0f6" stroke="#46506a" stroke-width="1.3"/><text x="1145" y="529" class="node" text-anchor="middle">Reconstruct</text><text x="1145" y="545" class="sub" text-anchor="middle">rebuild key/secret</text><text x="1145" y="558.5" class="sub" text-anchor="middle">→ secretbox open / unlock</text><line x1="200" y1="375" x2="235" y2="537" stroke="#566072" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="435" y1="537" x2="505" y2="537" stroke="#566072" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="705" y1="537" x2="775" y2="537" stroke="#566072" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="975" y1="537" x2="1045" y2="537" stroke="#566072" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="1245" y1="537" x2="1320" y2="375" stroke="#566072" stroke-width="1.4" marker-end="url(#arrow)"/><rect x="505" y="612" width="200" height="56" rx="7" ry="7" fill="#efeaf8" stroke="#6a4f9c" stroke-width="1.3"/><text x="605" y="632" class="node" text-anchor="middle">QR transfer  (optional)</text><text x="605" y="648" class="sub" text-anchor="middle">share strings → QR PNG (EC-H)</text><text x="605" y="661.5" class="sub" text-anchor="middle">scan elsewhere → decode (rqrr)</text><line x1="605" y1="574" x2="605" y2="612" stroke="#566072" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="576" y="584" width="58" height="16" rx="3" fill="#ffffff" stroke="#aab2bf" stroke-width="0.8"/><text x="605" y="596" class="lbl" text-anchor="middle">optional</text><line x1="705" y1="640" x2="775" y2="537" stroke="#566072" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="50" y="700" width="286" height="142" rx="7" fill="#ffffff" stroke="#aab2bf" stroke-width="1"/><text x="62" y="719" class="zone" text-anchor="start">Legend</text><rect x="62" y="729" width="17" height="12" rx="2.5" fill="#eaf3ee" stroke="#3c7d4f" stroke-width="1.2"/><text x="88" y="739" class="legend" text-anchor="start">Vault path (sv-core)</text><rect x="62" y="748" width="17" height="12" rx="2.5" fill="#e9f1fd" stroke="#2f6ab0" stroke-width="1.2"/><text x="88" y="758" class="legend" text-anchor="start">File encryption path (sv-platform)</text><rect x="62" y="767" width="17" height="12" rx="2.5" fill="#e7f1f2" stroke="#2f7b86" stroke-width="1.2"/><text x="88" y="777" class="legend" text-anchor="start">Steganography path (sv-stego)</text><rect x="62" y="786" width="17" height="12" rx="2.5" fill="#eef0f6" stroke="#46506a" stroke-width="1.2"/><text x="88" y="796" class="legend" text-anchor="start">Secret-sharing path (sv-platform / sv-core)</text><rect x="62" y="805" width="17" height="12" rx="2.5" fill="#efeaf8" stroke="#6a4f9c" stroke-width="1.2"/><text x="88" y="815" class="legend" text-anchor="start">QR transfer (sv-qr) — carries shares</text><line x1="62" y1="830" x2="79" y2="830" stroke="#566072" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrow)"/><text x="88" y="834" class="legend" text-anchor="start">optional / conditional step</text><rect x="372" y="700" width="1078" height="123" rx="7" fill="#ffffff" stroke="#aab2bf"/><text x="384" y="719" class="zone" text-anchor="start">Notes</text><text x="384" y="739" class="sub" text-anchor="start">• Four independent protection paths share the same input and produce the same recovered output; a user picks one (or composes them).</text><text x="384" y="758" class="sub" text-anchor="start">• Two distinct encryption mechanisms: the Vault payload uses age; standalone file encryption uses Argon2id + secretbox (SVENC). They are not the same pipeline.</text><text x="384" y="777" class="sub" text-anchor="start">• Secret sharing splits a key (the vault master key, or a freshly generated DEK that encrypts the payload) — never the raw passphrase.</text><text x="384" y="796" class="sub" text-anchor="start">• QR transfer is a transport for share strings only; it sits between 'Shares' and 'Recover' and is optional.</text><text x="384" y="815" class="sub" text-anchor="start">• Every recovery is fail-safe: a wrong key, wrong share set, or tampered carrier yields a coded error, not a partial/incorrect result.</text>
