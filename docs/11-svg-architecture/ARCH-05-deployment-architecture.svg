  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7.6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#566072"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1240" height="880" fill="#ffffff"/>
  <text x="40" y="44" class="title">ARCH-05 · Deployment Architecture</text>
  <text x="40" y="66" class="subtitle">Runtime deployment: application bundle, bundled+pinned resources, hardened subprocess execution, and OS / user-filesystem interaction</text>
  <line x1="40" y1="76" x2="1200" y2="76" stroke="#aab2bf" stroke-width="1"/>
<rect x="40" y="92" width="1160" height="690" rx="9" ry="9" fill="none" stroke="#5d6b7c" stroke-width="1.4" stroke-dasharray="7 5"/><rect x="54" y="81" width="299.8" height="22" rx="5" fill="#ffffff" stroke="#5d6b7c" stroke-width="1.1"/><text x="203.9" y="96" class="zone" text-anchor="middle" fill="#5d6b7c">Operating System  (macOS · Windows · Linux)</text><text x="1186" y="110" class="tag" text-anchor="end" fill="#5d6b7c">no network</text><rect x="70" y="140" width="690" height="600" rx="9" fill="#fbfcfe" stroke="#46506a" stroke-width="1.8"/><text x="85" y="165" class="nodeb" text-anchor="start">Secure Vault application bundle</text><text x="85" y="182" class="sub" text-anchor="start">productName: Secure Vault · id: org.secure-vault.desktop · v0.1.0 · bundle.targets: all</text><rect x="90" y="200" width="320" height="74" rx="7" ry="7" fill="#eef0f6" stroke="#46506a" stroke-width="1.3"/><text x="250" y="229" class="node" text-anchor="middle">Tauri 2 runtime</text><text x="250" y="245" class="sub" text-anchor="middle">Rust core (sv-app + crates)</text><text x="250" y="258.5" class="sub" text-anchor="middle">+ system WebView (WebKit/WebView2/WebKitGTK)</text><rect x="430" y="200" width="310" height="74" rx="7" ry="7" fill="#e9f1fd" stroke="#2f6ab0" stroke-width="1.3"/><text x="585" y="229" class="node" text-anchor="middle">Frontend assets</text><text x="585" y="245" class="sub" text-anchor="middle">frontendDist: frontend/</text><text x="585" y="258.5" class="sub" text-anchor="middle">HTML · JS · CSS · icons (withGlobalTauri)</text><line x1="410" y1="237" x2="430" y2="237" stroke="#566072" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="90" y="296" width="650" height="280" rx="8" fill="#ffffff" stroke="#6a4f9c" stroke-width="1.5"/><text x="104" y="320" class="zone" text-anchor="start" fill="#6a4f9c">Resources  (bundle.resources: "binaries/**/*")</text><rect x="108" y="336" width="290" height="64" rx="7" ry="7" fill="#fbe9e9" stroke="#b0413f" stroke-width="2"/><text x="253" y="360" class="node" text-anchor="middle">age</text><text x="253" y="376" class="sub" text-anchor="middle">BLAKE3-pinned · mandatory</text><text x="253" y="389.5" class="sub" text-anchor="middle">release fails to build if missing</text><circle cx="387" cy="347" r="4.2" fill="#b0413f"/><rect x="420" y="336" width="290" height="64" rx="7" ry="7" fill="#fbe9e9" stroke="#b0413f" stroke-width="2"/><text x="565" y="360" class="node" text-anchor="middle">age-keygen</text><text x="565" y="376" class="sub" text-anchor="middle">BLAKE3-pinned · mandatory</text><text x="565" y="389.5" class="sub" text-anchor="middle">vault identity generation</text><circle cx="699" cy="347" r="4.2" fill="#b0413f"/><rect x="108" y="414" width="290" height="64" rx="7" ry="7" fill="#efeaf8" stroke="#6a4f9c" stroke-width="1.3"/><text x="253" y="438" class="node" text-anchor="middle">ExifTool distribution</text><text x="253" y="454" class="sub" text-anchor="middle">exiftool + lib/  (or windows .exe)</text><text x="253" y="467.5" class="sub" text-anchor="middle">self-staged + pinned · optional</text><rect x="420" y="414" width="290" height="64" rx="7" ry="7" fill="#f4f6f9" stroke="#5b6675" stroke-width="1.3"/><text x="565" y="438" class="node" text-anchor="middle">pins embedded at build</text><text x="565" y="454" class="sub" text-anchor="middle">build.rs emit_pin → BLAKE3</text><text x="565" y="467.5" class="sub" text-anchor="middle">into the compiled binary</text><text x="104" y="502" class="tag" text-anchor="start" fill="#46506a">Runtime resolution:</text><text x="104" y="520" class="sub" text-anchor="start">• Resolved from the bundled app-resource directory — no env var, no repository path in a packaged build.</text><text x="104" y="538" class="sub" text-anchor="start">• The runtime re-verifies each binary's BLAKE3 pin before use; release refuses to run an unpinned mandatory binary.</text><text x="104" y="556" class="sub" text-anchor="start">• SV_*_BIN environment overrides are honoured in debug builds only.</text><rect x="90" y="600" width="650" height="56" rx="7" ry="7" fill="#fbe9e9" stroke="#b0413f" stroke-width="2"/><text x="415" y="626.75" class="node" text-anchor="middle">Spawned as hardened subprocess</text><text x="415" y="642.75" class="sub" text-anchor="middle">env_clear · wall-clock timeout · -config '' (ExifTool) · fail-closed when a tool is absent/unpinned</text><circle cx="729" cy="611" r="4.2" fill="#b0413f"/><line x1="255" y1="478" x2="255" y2="600" stroke="#566072" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="190" y="530" width="130" height="16" rx="3" fill="#ffffff" stroke="#aab2bf" stroke-width="0.8"/><text x="255" y="542" class="lbl" text-anchor="middle">resolve + verify pin</text><line x1="565" y1="478" x2="420" y2="600" stroke="#566072" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="800" y="200" width="360" height="120" rx="7" ry="7" fill="#eceff3" stroke="#5d6b7c" stroke-width="1.3"/><text x="980" y="245.25" class="node" text-anchor="middle">User data on filesystem</text><text x="980" y="261.25" class="sub" text-anchor="middle">.svault  ·  .svenc / .svkey  ·  .minisig</text><text x="980" y="274.75" class="sub" text-anchor="middle">.svshare / .svss  ·  QR .png  ·  images  ·  keys</text><text x="980" y="288.25" class="sub" text-anchor="middle">(under the user's own directories)</text><rect x="800" y="344" width="360" height="96" rx="7" ry="7" fill="#eceff3" stroke="#5d6b7c" stroke-width="1.3"/><text x="980" y="377.25" class="node" text-anchor="middle">OS integration</text><text x="980" y="393.25" class="sub" text-anchor="middle">File dialogs (tauri-plugin-dialog)</text><text x="980" y="406.75" class="sub" text-anchor="middle">Open / reveal in folder (tauri-plugin-opener)</text><text x="980" y="420.25" class="sub" text-anchor="middle">CSPRNG: getrandom / libsodium</text><rect x="800" y="464" width="360" height="92" rx="7" ry="7" fill="#eef0f6" stroke="#46506a" stroke-width="1.3"/><text x="980" y="495.25" class="node" text-anchor="middle">Process sandbox surface</text><text x="980" y="511.25" class="sub" text-anchor="middle">WebView ↔ Rust via IPC (no fs:/shell: to page)</text><text x="980" y="524.75" class="sub" text-anchor="middle">atomic temp → fsync → rename writes</text><text x="980" y="538.25" class="sub" text-anchor="middle">refuse-overwrite · path-stripped errors</text><line x1="740" y1="252" x2="800" y2="252" stroke="#566072" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="732" y="243" width="76" height="16" rx="3" fill="#ffffff" stroke="#aab2bf" stroke-width="0.8"/><text x="770" y="255" class="lbl" text-anchor="middle">IPC results</text><line x1="465" y1="656" x2="800" y2="410" stroke="#566072" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="570.5" y="524" width="124" height="16" rx="3" fill="#ffffff" stroke="#aab2bf" stroke-width="0.8"/><text x="632.5" y="536" class="lbl" text-anchor="middle">read / atomic write</text><line x1="740" y1="510" x2="800" y2="510" stroke="#566072" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="800" y="600" width="360" height="140" rx="8" fill="#fff8f8" stroke="#b0413f" stroke-width="1.2"/><text x="818" y="622" class="zone" text-anchor="start" fill="#b0413f">Out of scope (internal use)</text><text x="818" y="644" class="sub" text-anchor="start">• Code signing / notarization (hardening item H5)</text><text x="818" y="662" class="sub" text-anchor="start">• Per-OS signed installer for public distribution</text><text x="818" y="680" class="sub" text-anchor="start">Per-OS bundle internals (.app / .msi / AppImage)</text><text x="818" y="698" class="sub" text-anchor="start">differ; the logical structure shown is OS-agnostic.</text><text x="818" y="720" class="sub" text-anchor="start">Bundling itself (active, targets: all) is configured.</text><rect x="40" y="800" width="286" height="123" rx="7" fill="#ffffff" stroke="#aab2bf" stroke-width="1"/><text x="52" y="819" class="zone" text-anchor="start">Legend</text><rect x="52" y="829" width="17" height="12" rx="2.5" fill="#eef0f6" stroke="#46506a" stroke-width="1.2"/><text x="78" y="839" class="legend" text-anchor="start">Application runtime / native</text><rect x="52" y="848" width="17" height="12" rx="2.5" fill="#e9f1fd" stroke="#2f6ab0" stroke-width="1.2"/><text x="78" y="858" class="legend" text-anchor="start">Frontend assets</text><rect x="52" y="867" width="17" height="12" rx="2.5" fill="#efeaf8" stroke="#6a4f9c" stroke-width="1.2"/><text x="78" y="877" class="legend" text-anchor="start">Bundled resources / external tool</text><rect x="52" y="886" width="17" height="12" rx="2.5" fill="#fbe9e9" stroke="#b0413f" stroke-width="2"/><circle cx="65" cy="889.5" r="2.4" fill="#b0413f"/><text x="78" y="896" class="legend" text-anchor="start">Security-critical (pinned binary)</text><rect x="52" y="905" width="17" height="12" rx="2.5" fill="#eceff3" stroke="#5d6b7c" stroke-width="1.2"/><text x="78" y="915" class="legend" text-anchor="start">OS / user filesystem</text>
  <line x1="40" y1="846" x2="1200" y2="846" stroke="#aab2bf" stroke-width="1"/>
  <text x="40" y="864" class="foot">Secure Vault — Security &amp; Privacy Toolkit · v0.1.0   |   Source of truth: source code under secure-vault/ (see 11-svg-architecture/README.md)</text>
</svg>
